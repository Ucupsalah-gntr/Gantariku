<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <title>Sekolahku — Absensi &amp; SPP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

      :root {
        --bg: #F4F2FC;
        --surface: #FFFFFF;
        --ink: #211B3B;
        --ink-soft: #6E6690;
        --line: #E7E2F7;
        --primary: #6C4CF1;
        --primary-dark: #4E31D6;
        --primary-soft: #EDE7FD;
        --teal: #0EA5A0;
        --pink: #EC4899;
        --good: #16A34A;
        --good-soft: #DCF7E5;
        --warn: #D97706;
        --warn-soft: #FDECD1;
        --sick: #7C3AED;
        --sick-soft: #EEE5FD;
        --bad: #E11D48;
        --bad-soft: #FCE1E8;
        --muted: #F1EEFA;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2 {
        font-family: 'Space Grotesk', sans-serif;
      }

      .app {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 246px;
        flex-shrink: 0;
        background: linear-gradient(180deg, #4E31D6 0%, #6C4CF1 55%, #8B5CF6 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        padding: 24px 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: rgba(255, 255, 255, .18);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }

      .brand-text {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 16px;
        line-height: 1.1;
      }

      .brand-sub {
        font-size: 11px;
        color: rgba(255, 255, 255, .7);
      }

      .role-card {
        background: rgba(255, 255, 255, .12);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 22px;
      }

      .role-label {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: .04em;
        color: rgba(255, 255, 255, .6);
        padding: 4px 6px 8px;
      }

      .role-options {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .role-btn {
        all: unset;
        cursor: pointer;
        padding: 8px 10px;
        border-radius: 7px;
        font-size: 13px;
        color: rgba(255, 255, 255, .85);
        font-weight: 500;
        transition: background .15s;
      }

      .role-btn:hover {
        background: rgba(255, 255, 255, .12);
      }

      .role-btn.active {
        background: #fff;
        color: var(--primary-dark);
        font-weight: 700;
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .nav-item {
        all: unset;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 11px;
        border-radius: 8px;
        font-size: 13.5px;
        color: rgba(255, 255, 255, .8);
      }

      .nav-item svg {
        flex-shrink: 0;
        opacity: .85;
      }

      .nav-item:hover {
        background: rgba(255, 255, 255, .1);
      }

      .nav-item.active {
        background: rgba(255, 255, 255, .95);
        color: var(--primary-dark);
        font-weight: 600;
      }

      .nav-item.active svg {
        opacity: 1;
      }

      .sidebar-foot {
        margin-top: auto;
        padding-top: 14px;
        font-size: 11px;
        color: rgba(255, 255, 255, .7);
        line-height: 1.6;
      }

      .conn-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 6px;
        background: #FBBF24;
      }

      .conn-dot.ok {
        background: #34D399;
      }

      .conn-dot.err {
        background: #F87171;
      }

      .content {
        flex: 1;
        min-width: 0;
      }

      .topbar {
        padding: 26px 34px 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        flex-wrap: wrap;
      }

      .topbar h1 {
        font-size: 23px;
        font-weight: 700;
        margin: 0 0 4px;
      }

      .topbar p {
        margin: 0;
        color: var(--ink-soft);
        font-size: 13px;
      }

      .today-chip {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 7px 14px;
        font-size: 12.5px;
        color: var(--ink-soft);
        font-weight: 500;
        white-space: nowrap;
      }

      .view {
        padding: 6px 34px 50px;
        max-width: 1160px;
      }

      .stat-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 22px;
      }

      .stat {
        background: var(--surface);
        border-radius: 14px;
        padding: 16px 18px;
        border-left: 4px solid var(--primary);
        box-shadow: 0 1px 2px rgba(33, 27, 59, .05);
      }

      .stat.c-teal {
        border-left-color: var(--teal);
      }

      .stat.c-good {
        border-left-color: var(--good);
      }

      .stat.c-bad {
        border-left-color: var(--bad);
      }

      .stat.c-pink {
        border-left-color: var(--pink);
      }

      .stat .num {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 25px;
        font-weight: 700;
        line-height: 1.1;
      }

      .stat .lbl {
        font-size: 12px;
        color: var(--ink-soft);
        margin-top: 5px;
      }

      .section {
        background: var(--surface);
        border-radius: 16px;
        margin-bottom: 20px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(33, 27, 59, .05);
      }

      .section-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .section-head h2 {
        font-size: 16px;
        font-weight: 700;
        margin: 0;
      }

      .section-body {
        padding: 18px 20px;
      }

      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      input[type=text],
      select {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
      }

      input[type=text]:focus,
      select:focus {
        outline: 2px solid var(--primary);
        outline-offset: 1px;
        background: #fff;
      }

      input[type=text] {
        min-width: 190px;
      }

      .btn {
        all: unset;
        cursor: pointer;
        padding: 8px 15px;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        font-size: 12.5px;
        transition: background .15s, transform .1s;
      }

      .btn:hover {
        background: var(--primary-dark);
      }

      .btn:active {
        transform: scale(.97);
      }

      .btn:disabled {
        opacity: .5;
        cursor: not-allowed;
      }

      .btn.secondary {
        background: var(--primary-soft);
        color: var(--primary-dark);
      }

      .btn.secondary:hover {
        background: #DED3FB;
      }

      .btn.ghost {
        background: transparent;
        color: var(--ink-soft);
        border: 1px solid var(--line);
      }

      .btn.ghost:hover {
        background: var(--muted);
      }

      .btn.small {
        padding: 6px 11px;
        font-size: 11.5px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .03em;
        color: var(--ink-soft);
        font-weight: 600;
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
      }

      td {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        font-size: 13.5px;
      }

      tbody tr:hover {
        background: var(--bg);
      }

      tr:last-child td {
        border-bottom: none;
      }

      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 600;
      }

      .badge-good {
        background: var(--good-soft);
        color: var(--good);
      }

      .badge-warn {
        background: var(--warn-soft);
        color: var(--warn);
      }

      .badge-sick {
        background: var(--sick-soft);
        color: var(--sick);
      }

      .badge-bad {
        background: var(--bad-soft);
        color: var(--bad);
      }

      .badge-muted {
        background: var(--muted);
        color: var(--ink-soft);
      }

      .empty {
        padding: 34px;
        text-align: center;
        color: var(--ink-soft);
        font-size: 13px;
      }

      .att-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .att-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
      }

      .att-name {
        font-weight: 600;
      }

      .att-choices {
        display: flex;
        gap: 6px;
      }

      .chip {
        all: unset;
        cursor: pointer;
        padding: 6px 13px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid var(--line);
        color: var(--ink-soft);
        background: #fff;
        transition: transform .1s;
      }

      .chip:active {
        transform: scale(.95);
      }

      .chip.sel-H {
        background: var(--good);
        color: #fff;
        border-color: var(--good);
      }

      .chip.sel-I {
        background: var(--warn);
        color: #fff;
        border-color: var(--warn);
      }

      .chip.sel-S {
        background: var(--sick);
        color: #fff;
        border-color: var(--sick);
      }

      .chip.sel-A {
        background: var(--bad);
        color: #fff;
        border-color: var(--bad);
      }

      .hint {
        font-size: 12px;
        color: var(--ink-soft);
        margin-top: 8px;
      }

      .inline-form {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 14px;
        padding: 12px;
        background: var(--bg);
        border-radius: 10px;
      }

      .icon-btn {
        all: unset;
        cursor: pointer;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        color: var(--ink-soft);
      }

      .icon-btn:hover {
        background: var(--bad-soft);
        color: var(--bad);
      }

      .setup-wrap {
        max-width: 640px;
        margin: 40px auto;
        padding: 28px;
        background: var(--surface);
        border-radius: 16px;
        box-shadow: 0 1px 2px rgba(33, 27, 59, .05);
      }

      .setup-wrap h2 {
        margin-top: 0;
      }

      .setup-wrap ol {
        padding-left: 20px;
        line-height: 1.9;
      }

      .setup-wrap code {
        background: var(--muted);
        padding: 2px 6px;
        border-radius: 5px;
        font-size: 12.5px;
      }

      .setup-wrap pre {
        background: #211B3B;
        color: #E7E2F7;
        padding: 14px 16px;
        border-radius: 10px;
        font-size: 12px;
        overflow-x: auto;
      }

      @media (max-width: 900px) {
        .stat-row {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 760px) {
        .app {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
          gap: 10px;
          padding: 14px 16px;
        }

        .role-card,
        .nav,
        .sidebar-foot {
          display: none;
        }

        .view,
        .topbar {
          padding-left: 18px;
          padding-right: 18px;
        }

        .stat-row {
          grid-template-columns: 1fr 1fr;
        }

        .setup-wrap {
          margin: 20px 16px;
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">🎒</div>
          <div>
            <div class="brand-text">Sekolahku</div>
            <div class="brand-sub">Absensi &amp; SPP</div>
          </div>
        </div>
        <div class="role-card">
          <div class="role-label">Masuk sebagai</div>
          <div class="role-options" id="roleOptions"></div>
        </div>
        <div class="nav" id="nav"></div>
        <div class="sidebar-foot">
          <span class="conn-dot" id="connDot"></span>
          <span id="connText">Menghubungkan...</span>
        </div>
      </aside>
      <main class="content">
        <header class="topbar">
          <div>
            <h1 id="pageTitle">Dasbor</h1>
            <p id="pageSub">Ringkasan hari ini</p>
          </div>
          <div class="today-chip" id="todayChip"></div>
        </header>
        <section class="view" id="view"></section>
      </main>
    </div>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      // =========================================================
      // SUPABASE CONFIG
      // Isi dari: Supabase Dashboard > Project Settings > API
      // =========================================================
      const SUPABASE_URL = "https://your-project.supabase.co";
      const SUPABASE_ANON_KEY = "your-anon-key-here";

      const isConfigured =
        SUPABASE_URL.startsWith("https://") &&
        !SUPABASE_URL.includes("your-project") &&
        SUPABASE_ANON_KEY &&
        !SUPABASE_ANON_KEY.includes("your-anon");

      const supabase = isConfigured
        ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;

      // =========================================================
      // APPLICATION
      // =========================================================

      // Show setup message if not configured
      if (!isConfigured) {
        document.getElementById("view").innerHTML = `
          <div class="setup-wrap">
            <h2>⚙️ Setup Diperlukan</h2>
            <p>Aplikasi ini memerlukan konfigurasi Supabase untuk berfungsi:</p>
            <ol>
              <li>Buka dashboard Supabase Anda di <code>https://supabase.com</code></li>
              <li>Buka <em>Project Settings → API</em></li>
              <li>Salin <code>Project URL</code> dan <code>anon key</code></li>
              <li>Edit file HTML ini dan ganti:
                <pre>const SUPABASE_URL = "YOUR_PROJECT_URL";
const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";</pre>
              </li>
              <li>Simpan dan upload ulang ke hosting</li>
            </ol>
          </div>
        `;
        document.getElementById("pageTitle").textContent = "Setup Diperlukan";
        document.getElementById("pageSub").textContent = "Sambungkan ke Supabase";
      } else {
        document.getElementById("connDot").classList.add("ok");
        document.getElementById("connText").textContent = "Terhubung";
        // Add your application logic here
      }
    </script>
  </body>
</html>
