<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <title>Gantariku — Absensi &amp; SPP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

      :root {
        --bg: #F4F2FC;
        --surface: #FFFFFF;
        --ink: #211B3B;
        --ink-soft: #6E6690;
        --line: #E7E2F7;
        --primary: #6C4CF1;
        --primary-dark: #4E31D6;
        --primary-soft: #EDE7FD;
        --teal: #0EA5A0;
        --pink: #EC4899;
        --good: #16A34A;
        --good-soft: #DCF7E5;
        --warn: #D97706;
        --warn-soft: #FDECD1;
        --sick: #7C3AED;
        --sick-soft: #EEE5FD;
        --bad: #E11D48;
        --bad-soft: #FCE1E8;
        --muted: #F1EEFA;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2 { font-family: 'Space Grotesk', sans-serif; }

      /* ========== LOGIN PAGE ========== */
      .login-container {
        display: flex;
        min-height: 100vh;
        background: linear-gradient(135deg, #4E31D6 0%, #6C4CF1 50%, #8B5CF6 100%);
      }

      .login-box {
        margin: auto;
        background: var(--surface);
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(33, 27, 59, .3);
      }

      .login-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 30px;
      }

      .login-logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: linear-gradient(135deg, #4E31D6, #6C4CF1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        color: white;
      }

      .login-brand { text-align: left; }

      .login-brand h1 {
        font-size: 24px;
        font-weight: 700;
        margin: 0;
        color: var(--ink);
      }

      .login-brand p {
        font-size: 12px;
        color: var(--ink-soft);
        margin: 4px 0 0;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
      }

      .form-group input,
      .form-group select {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        color: var(--ink);
        background: #fff;
        transition: border-color .2s, box-shadow .2s;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(108, 76, 241, .1);
      }

      .login-btn {
        padding: 10px 16px;
        background: linear-gradient(135deg, #4E31D6, #6C4CF1);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: transform .1s, box-shadow .2s;
      }

      .login-btn:hover { box-shadow: 0 10px 30px rgba(108, 76, 241, .3); }
      .login-btn:active { transform: scale(.95); }
      .login-btn:disabled { opacity: .6; cursor: not-allowed; }

      .error-msg {
        padding: 10px 12px;
        background: var(--bad-soft);
        color: var(--bad);
        border-radius: 8px;
        font-size: 13px;
        display: none;
      }

      .error-msg.show { display: block; }

      .loading-spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, .3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin .8s linear infinite;
        margin-right: 6px;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      /* ========== APP PAGE ========== */
      .app { display: flex; min-height: 100vh; }

      .sidebar {
        width: 246px;
        flex-shrink: 0;
        background: linear-gradient(180deg, #4E31D6 0%, #6C4CF1 55%, #8B5CF6 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        padding: 24px 18px;
        position: relative;
      }

      /* Wrapper for user-info + nav + sidebar-foot. On desktop this is just
         a normal flex column filling the sidebar; on mobile it becomes a
         collapsible dropdown panel (see media query below). */
      .sidebar-menu {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }

      .mobile-menu-btn {
        display: none;
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 8px;
        background: rgba(255, 255, 255, .15);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        flex-shrink: 0;
      }

      .mobile-menu-btn:hover { background: rgba(255, 255, 255, .25); }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: rgba(255, 255, 255, .18);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }

      .brand-text {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 16px;
        line-height: 1.1;
      }

      .brand-sub { font-size: 11px; color: rgba(255, 255, 255, .7); }

      .user-info {
        background: rgba(255, 255, 255, .12);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 22px;
        font-size: 12px;
      }

      .user-name { font-weight: 600; color: #fff; }
      .user-role { font-size: 11px; color: rgba(255, 255, 255, .7); margin-top: 2px; }

      .nav { display: flex; flex-direction: column; gap: 3px; }

      .nav-item {
        all: unset;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 11px;
        border-radius: 8px;
        font-size: 13.5px;
        color: rgba(255, 255, 255, .8);
      }

      .nav-item:hover { background: rgba(255, 255, 255, .1); }

      .nav-item.active {
        background: rgba(255, 255, 255, .95);
        color: var(--primary-dark);
        font-weight: 600;
      }

      .sidebar-foot {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-top: 14px;
        font-size: 11px;
        color: rgba(255, 255, 255, .7);
      }

      .conn-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #34D399;
      }

      .logout-btn {
        all: unset;
        cursor: pointer;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, .3);
        color: rgba(255, 255, 255, .8);
        font-size: 12px;
        font-weight: 600;
        transition: background .15s;
        text-align: center;
      }

      .logout-btn:hover { background: rgba(255, 255, 255, .1); }

      .content { flex: 1; min-width: 0; }

      .topbar {
        padding: 26px 34px 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        flex-wrap: wrap;
      }

      .topbar h1 { font-size: 23px; font-weight: 700; margin: 0 0 4px; }
      .topbar p { margin: 0; color: var(--ink-soft); font-size: 13px; }

      .today-chip {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 7px 14px;
        font-size: 12.5px;
        color: var(--ink-soft);
        font-weight: 500;
        white-space: nowrap;
      }

      
      .dash-welcome{background:linear-gradient(135deg,var(--primary-soft) 0%,#fff 72%);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 6px 20px rgba(108,76,241,.06)}
      .dash-welcome h2{margin:0 0 5px;font-size:20px}.dash-welcome p{margin:0;color:var(--ink-soft);line-height:1.5}.dash-welcome-mark{font-size:38px;line-height:1}
      .dash-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.dash-mini{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.dash-mini-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.dash-mini-label{font-size:12px;color:var(--ink-soft)}.dash-mini-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;margin-top:5px}.dash-mini-sub{font-size:11px;color:var(--ink-soft);margin-top:4px}.dash-progress{margin-top:9px;height:7px;border-radius:20px;background:var(--muted);overflow:hidden}.dash-progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--pink));border-radius:20px;transition:width .4s ease}
      .dash-two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start}.dash-list{display:flex;flex-direction:column;gap:9px}.dash-list-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.dash-list-main{min-width:0}.dash-list-title{font-weight:600;font-size:13px}.dash-list-sub{font-size:11px;color:var(--ink-soft);margin-top:2px}.dash-pill{font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);white-space:nowrap}

.view { padding: 6px 34px 50px; max-width: 1160px; }

      .stat-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 22px;
      }

      .stat {
        background: var(--surface);
        border-radius: 14px;
        padding: 16px 18px;
        border-left: 4px solid var(--primary);
        box-shadow: 0 1px 2px rgba(33, 27, 59, .05);
      }

      .stat.c-teal { border-left-color: var(--teal); }
      .stat.c-good { border-left-color: var(--good); }
      .stat.c-bad { border-left-color: var(--bad); }
      .stat.c-pink { border-left-color: var(--pink); }
      .stat.c-warn { border-left-color: var(--warn); }
      .stat.c-sick { border-left-color: var(--sick); }

      .stat .num {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 25px;
        font-weight: 700;
        line-height: 1.1;
      }

      .stat .lbl { font-size: 12px; color: var(--ink-soft); margin-top: 5px; }

      .section {
        background: var(--surface);
        border-radius: 16px;
        margin-bottom: 20px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(33, 27, 59, .05);
      }

      .section-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .section-head h2 { font-size: 16px; font-weight: 700; margin: 0; }
      .section-body { padding: 18px 20px; }

      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      input[type=text],
      input[type=email],
      input[type=password],
      input[type=date],
      input[type=number],
      select {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
      }

      input[type=text]:focus,
      input[type=email]:focus,
      input[type=password]:focus,
      input[type=date]:focus,
      input[type=number]:focus,
      select:focus {
        outline: 2px solid var(--primary);
        outline-offset: 1px;
        background: #fff;
      }

      .btn {
        all: unset;
        cursor: pointer;
        padding: 8px 15px;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        font-size: 12.5px;
        transition: background .15s, transform .1s;
      }

      .btn:hover { background: var(--primary-dark); }
      .btn:active { transform: scale(.97); }
      .btn.secondary { background: var(--primary-soft); color: var(--primary-dark); }

      .btn.ghost {
        background: transparent;
        color: var(--ink-soft);
        border: 1px solid var(--line);
      }

      .btn.small { padding: 6px 11px; font-size: 11.5px; }

      table { width: 100%; border-collapse: collapse; }

      th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .03em;
        color: var(--ink-soft);
        font-weight: 600;
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
      }

      td {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        font-size: 13.5px;
      }

      tbody tr:hover { background: var(--bg); }
      tr:last-child td { border-bottom: none; }

      td.num, th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 600;
      }

      .badge-good { background: var(--good-soft); color: var(--good); }
      .badge-warn { background: var(--warn-soft); color: var(--warn); }
      .badge-sick { background: var(--sick-soft); color: var(--sick); }
      .badge-bad { background: var(--bad-soft); color: var(--bad); }
      .badge-muted { background: var(--muted); color: var(--ink-soft); }

      .empty {
        padding: 34px;
        text-align: center;
        color: var(--ink-soft);
        font-size: 13px;
      }


      .notif-panel{display:none;position:absolute;right:20px;top:58px;width:min(360px,calc(100vw - 40px));background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 45px rgba(33,27,59,.18);z-index:100;padding:14px}
      .notif-panel.show{display:block}
      .notif-item{padding:10px 8px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.45}
      .notif-item:last-child{border-bottom:none}

      @media (max-width: 900px) {
        .stat-row { grid-template-columns: repeat(2, 1fr); }
      }

      @media (max-width: 900px) {
        .dash-summary{grid-template-columns:1fr 1fr}
        .dash-two-col{grid-template-columns:1fr}
      }

      @media (max-width: 760px) {
        .app { flex-direction: column; }

        .sidebar {
          width: 100%;
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          padding: 12px 16px;
        }

        .brand { margin-bottom: 0; }

        .mobile-menu-btn { display: flex; }

        /* Collapsed by default on mobile: shown as a dropdown panel
           when the sidebar has the .mobile-open class (toggled by the
           hamburger button). */
        .sidebar-menu {
          display: none;
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          background: var(--primary-dark);
          padding: 14px 16px 18px;
          box-shadow: 0 14px 30px rgba(33, 27, 59, .35);
          z-index: 30;
          max-height: calc(100vh - 60px);
          overflow-y: auto;
        }

        .sidebar.mobile-open .sidebar-menu { display: flex; }

        .user-info { margin-bottom: 14px; }

        .sidebar-foot { padding-top: 10px; }

        .view, .topbar { padding-left: 18px; padding-right: 18px; }

        .stat-row { grid-template-columns: 1fr 1fr; }
        .dash-summary{grid-template-columns:1fr}.dash-welcome{padding:16px}.dash-welcome h2{font-size:18px}.dash-welcome-mark{font-size:31px}

        .login-box { padding: 30px 20px; max-width: calc(100% - 40px); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      // ============================================================
      // SUPABASE CONFIGURATION
      // ============================================================
      const SUPABASE_URL = "https://uwrbirojmuudshhrrcgt.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_SP0aUTX9jn9p1Kzv74S_Fg_eT4Hrs5E";

      const isConfigured =
        /^https:\/\/.+\.supabase\.co$/.test(SUPABASE_URL) &&
        SUPABASE_ANON_KEY &&
        !SUPABASE_ANON_KEY.includes("PASTE_YOUR");

      let supabase = null;

      if (isConfigured) {
        try {
          const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
          supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (err) {
          // Kalau CDN esm.sh gagal dimuat (jaringan lambat, diblokir, dsb),
          // jangan biarkan seluruh script berhenti — cukup catat error dan
          // biarkan aplikasi tetap render (akan jatuh ke tampilan login
          // dengan pesan "belum terhubung").
          console.error("Gagal memuat Supabase SDK:", err);
          supabase = null;
        }
      }

      // ============================================================
      // GLOBAL STATE
      // ============================================================
      let currentUser = null;
      let currentUserRole = null;
      let currentNav = "dasbor";
      let semuaSiswa = [];
      let semuaOrangTua = [];

      // ============================================================
      // NAVIGATION CONFIG
      // ============================================================
      const NAV_CONFIG = {
        admin: [
          { id: "dasbor", label: "Dasbor", icon: "📊" },
          { id: "siswa", label: "Data Siswa", icon: "👥" },
          { id: "spp", label: "Monitoring SPP", icon: "💰" },
          { id: "guru", label: "Guru & Pelatih", icon: "🩰" },
          { id: "absen-guru", label: "Absensi Guru", icon: "👩‍🏫" },
          { id: "rekap", label: "Rekap Absensi", icon: "📋" },
          { id: "perkembangan", label: "Perkembangan Anak", icon: "🌱" },
        ],
        guru: [
          { id: "input-absen", label: "Input Absensi", icon: "✓" },
          { id: "absen-saya", label: "Kehadiran Saya", icon: "🕘" },
          { id: "riwayat-absen", label: "Riwayat Absensi", icon: "📅" },
          { id: "perkembangan-input", label: "Perkembangan Anak", icon: "🌱" },
        ],
        ortu: [
          { id: "ringkasan", label: "Ringkasan Anak", icon: "👧" },
          { id: "absen-anak", label: "Kehadiran Anak", icon: "📅" },
          { id: "spp-anak", label: "Status SPP", icon: "💳" },
          { id: "perkembangan-anak", label: "Perkembangan Anak", icon: "🌱" },
        ],
      };

      // ============================================================
      // LOAD USER PROFILE
      // ============================================================
      async function loadUserProfile(userId) {
        if (!supabase) throw new Error("Supabase belum dikonfigurasi");

        const { data, error } = await supabase
          .from("pengguna")
          .select("id, user_id, nama, email, role")
          .eq("user_id", userId)
          .single();

        if (error) {
          console.error("Profile error:", error);
          throw new Error("Profil pengguna tidak ditemukan atau tidak dapat diakses.");
        }
        if (!data) throw new Error("Profil pengguna tidak ditemukan.");

        return data;
      }

      // ============================================================
      // LOGIN UI
      // ============================================================
      function renderLoginPage() {
        return `
          <div class="login-container">
            <div class="login-box">
              <div class="login-header">
                <div class="login-logo">🎒</div>
                <div class="login-brand">
                  <h1>Gantariku</h1>
                  <p>Absensi &amp; SPP</p>
                </div>
              </div>

              <div class="error-msg" id="loginError"></div>

              <form class="login-form" id="loginForm">
                <div class="form-group">
                  <label for="email">Email</label>
                  <input type="email" id="email" placeholder="nama@sekolah.id" required>
                </div>

                <div class="form-group">
                  <label for="password">Password</label>
                  <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                  <span id="loginBtnText">Masuk</span>
                </button>
              </form>
            </div>
          </div>
        `;
      }

      function renderLogin() {
        document.getElementById("app").innerHTML = renderLoginPage();
        document.getElementById("loginForm").addEventListener("submit", handleLogin);
      }

      // ============================================================
      // LOGIN HANDLER
      // ============================================================
      async function handleLogin(e) {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const errorEl = document.getElementById("loginError");
        const btnEl = document.getElementById("loginBtn");
        const btnText = document.getElementById("loginBtnText");

        errorEl.textContent = "";
        errorEl.classList.remove("show");

        if (!email || !password) {
          errorEl.textContent = "Email dan password harus diisi.";
          errorEl.classList.add("show");
          return;
        }

        btnEl.disabled = true;
        btnText.innerHTML = '<span class="loading-spinner"></span>Memproses...';

        try {
          if (!supabase) throw new Error("Tidak dapat terhubung ke server. Periksa koneksi internet Anda, lalu muat ulang halaman.");

          const { data: authData, error: authError } = await supabase.auth.signInWithPassword({ email, password });
          if (authError) throw new Error("Email atau password salah.");
          if (!authData.user) throw new Error("User tidak ditemukan.");

          const profile = await loadUserProfile(authData.user.id);

          currentUser = profile;
          currentUserRole = profile.role;
          currentNav = NAV_CONFIG[currentUserRole]?.[0]?.id || "dasbor";

          renderApp();
        } catch (error) {
          console.error("Login error:", error);
          if (supabase) await supabase.auth.signOut();
          errorEl.textContent = error.message || "Terjadi kesalahan saat login.";
          errorEl.classList.add("show");

      async function loadDasbor() {
        if (!supabase) return;

        const today = new Date();
        const todayStr = today.toISOString().slice(0, 10);
        const bulanIni = today.getMonth() + 1;
        const tahunIni = today.getFullYear();

        const lblLunas = document.getElementById("lblLunas");
        const lblBelumBayar = document.getElementById("lblBelumBayar");
        if (lblLunas) lblLunas.textContent = `Lunas SPP — ${namaBulan(bulanIni)}`;
        if (lblBelumBayar) lblBelumBayar.textContent = `Belum bayar — ${namaBulan(bulanIni)}`;

        try {
          const { count: totalSiswa } = await supabase
            .from("siswa")
            .select("id", { count: "exact", head: true });
          const totalEl = document.getElementById("dashTotalSiswa");
          if (totalEl) totalEl.textContent = totalSiswa || 0;

          const { data: absensiHariIni, error: absensiError } = await supabase
            .from("absensi")
            .select("status, siswa:siswa_id ( nama, kelas )")
            .eq("tanggal", todayStr);
          if (absensiError) throw absensiError;

          const hadirCount = (absensiHariIni || []).filter((a) => a.status === "H").length;
          const statHadirEl = document.getElementById("statHadir");
          if (statHadirEl) statHadirEl.textContent = `${hadirCount}/${totalSiswa || 0}`;
          const persenHadir = totalSiswa ? Math.round((hadirCount / totalSiswa) * 100) : 0;
          const dashPersenEl = document.getElementById("dashPersenHadir");
          const dashHadirSub = document.getElementById("dashHadirSub");
          const dashHadirProgress = document.getElementById("dashHadirProgress");
          if (dashPersenEl) dashPersenEl.textContent = `${persenHadir}%`;
          if (dashHadirSub) dashHadirSub.textContent = `${hadirCount} dari ${totalSiswa || 0} siswa tercatat hadir`;
          if (dashHadirProgress) dashHadirProgress.style.width = `${persenHadir}%`;

          const tbody = document.getElementById("tbodyKehadiranHariIni");
          if (tbody) {
            if (!absensiHariIni || absensiHariIni.length === 0) {
              tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Belum ada absensi hari ini.</td></tr>`;
            } else {
              tbody.innerHTML = absensiHariIni
                .map(
                  (a) => `
                <tr>
                  <td>${a.siswa?.nama || "-"}</td>
                  <td>${a.siswa?.kelas || "-"}</td>
                  <td><span class="badge ${statusBadgeAbsensi(a.status)}">${labelStatusAbsensi(a.status)}</span></td>
                </tr>
              `
                )
                .join("");
            }
          }

          const { data: sppBulanIni, error: sppError } = await supabase
            .from("spp")
            .select("status, nominal")
            .eq("bulan", bulanIni)
            .eq("tahun", tahunIni);
          if (sppError) throw sppError;

          const lunas = (sppBulanIni || []).filter((s) => s.status === "Lunas");
          const belumBayar = (sppBulanIni || []).filter((s) => s.status !== "Lunas");
          const totalTunggakan = belumBayar.reduce((sum, s) => sum + (Number(s.nominal) || 0), 0);

          document.getElementById("statLunas").textContent = lunas.length;
          document.getElementById("statBelumBayar").textContent = belumBayar.length;
          document.getElementById("statTunggakan").textContent = formatRupiah(totalTunggakan);
          const totalPemasukan = lunas.reduce((sum, s) => sum + (Number(s.nominal) || 0), 0);
          const dashPemasukan = document.getElementById("dashPemasukan");
          const dashPemasukanSub = document.getElementById("dashPemasukanSub");
          if (dashPemasukan) dashPemasukan.textContent = formatRupiah(totalPemasukan);
          if (dashPemasukanSub) dashPemasukanSub.textContent = `${lunas.length} tagihan SPP lunas · ${namaBulan(bulanIni)}`;
        } catch (error) {
          console.error("Error load dasbor:", error);
        }
      }

      async function loadPerhatian() {
        if (!supabase || currentUserRole !== "admin") return;
        const body = document.getElementById("perhatianBody");
        const status = document.getElementById("perhatianStatus");
        if (!body) return;

        try {
          const now = new Date();
          const bulan = now.getMonth() + 1;
          const tahun = now.getFullYear();
          const todayStr = now.toISOString().slice(0, 10);

          const [{ data: siswa }, { data: spp }, { data: absensi }, { data: guru }, { data: absensiGuru }] = await Promise.all([
            supabase.from("siswa").select("id, nama, kelas"),
            supabase.from("spp").select("siswa_id, status, nominal").eq("bulan", bulan).eq("tahun", tahun),
            supabase.from("absensi").select("siswa_id, status").eq("tanggal", todayStr),
            supabase.from("pengguna").select("id, nama").eq("role", "guru"),
            supabase.from("absensi_guru").select("guru_id").eq("tanggal", todayStr),
          ]);

          const tagihanBelum = (spp || []).filter(x => x.status !== "Lunas").length;
          const siswaIds = new Set((absensi || []).map(x => x.siswa_id));
          const belumAbsenSiswa = (siswa || []).filter(x => !siswaIds.has(x.id));
          const guruIds = new Set((absensiGuru || []).map(x => x.guru_id));
          const belumAbsenGuru = (guru || []).filter(x => !guruIds.has(x.id));

          const items = [];
          if (tagihanBelum > 0) items.push(`<div style="padding:10px 12px;border-radius:10px;background:var(--bad-soft);margin-bottom:8px;">💳 <strong>${tagihanBelum}</strong> tagihan SPP ${namaBulan(bulan)} belum lunas.</div>`);
          if (belumAbsenSiswa.length > 0) items.push(`<div style="padding:10px 12px;border-radius:10px;background:var(--warn-soft);margin-bottom:8px;">👧 <strong>${belumAbsenSiswa.length}</strong> siswa belum tercatat absensinya hari ini.</div>`);
          if (belumAbsenGuru.length > 0) items.push(`<div style="padding:10px 12px;border-radius:10px;background:var(--primary-soft);margin-bottom:8px;">👩‍🏫 <strong>${belumAbsenGuru.length}</strong> guru/pelatih belum mengisi absensi hari ini.</div>`);

          if (items.length === 0) {
            body.innerHTML = `<div style="padding:12px;border-radius:10px;background:var(--good-soft);color:var(--good);font-weight:600;">🎉 Semua terlihat aman. Tidak ada hal penting yang perlu ditindaklanjuti.</div>`;
            if (status) { status.textContent = "Aman"; status.className = "badge badge-good"; }
          } else {
            body.innerHTML = items.join("");
            if (status) { status.textContent = `${items.length} perhatian`; status.className = "badge badge-warn"; }
          }
        } catch (error) {
          console.error("Error load perhatian:", error);
          body.innerHTML = `<div class="empty" style="color:#E11D48;">Belum bisa memuat ringkasan perhatian.</div>`;
          if (status) status.textContent = "Tidak tersedia";
        }
      }

      async function simpanSiswa(event) {
        event.preventDefault();

        if (!supabase) {
          alert("Supabase belum terhubung.");
          return;
        }

        const btn = document.getElementById("btnSimpanSiswa");
        const nama = document.getElementById("siswaNama").value.trim();
        const nis = document.getElementById("siswaNis").value.trim();
        const kelas = document.getElementById("siswaKelas").value.trim();
        const tahunAjaran = document.getElementById("siswaTahunAjaran").value.trim();
        const tanggalLahir = document.getElementById("siswaTanggalLahir").value;
        const jenisKelamin = document.getElementById("siswaJenisKelamin").value;
        const nomorHpOrtu = document.getElementById("siswaNomorHpOrtu").value.trim();

            nis,
            kelas,
            tahun_ajaran: tahunAjaran || null,
            tanggal_lahir: tanggalLahir || null,
            jenis_kelamin: jenisKelamin || null,

            orang_tua_id: orangTuaId || null,

          };

          const { error } = await supabase.from("siswa").insert(dataSiswa).select();
          if (error) throw error;

          alert("Siswa berhasil ditambahkan!");
          tutupFormSiswa();
          await loadSiswa();
        } catch (error) {
          console.error("Error tambah siswa:", error);
          alert("Gagal menyimpan siswa:\n\n" + error.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Simpan Siswa";

      async function loadSiswa() {
        const tbody = document.getElementById("daftarSiswa");
        if (!tbody) return;

        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Memuat data siswa...</td></tr>`;

        try {
          if (!supabase) throw new Error("Supabase belum terhubung.");

          const { data, error } = await supabase
            .from("siswa")
            .select("id, nama, nis, kelas, tahun_ajaran, nomor_hp_ortu, orang_tua_id, orang_tua:orang_tua_id ( id, nama, email )")
            .order("created_at", { ascending: false });

          if (error) throw error;

          semuaSiswa = data || [];

          if (semuaSiswa.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Belum ada data siswa.</td></tr>`;
            return;
          }

          renderDaftarSiswa(semuaSiswa);
        } catch (error) {
          console.error("Error load siswa:", error);
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#E11D48;">Gagal memuat data siswa.</td></tr>`;
        }
      }

      function renderDaftarSiswa(dataSiswa) {
        const tbody = document.getElementById("daftarSiswa");
        if (!tbody) return;

        if (!dataSiswa || dataSiswa.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Data siswa tidak ditemukan.</td></tr>`;
          return;
        }

        tbody.innerHTML = dataSiswa
          .map(
            (siswa) => `
          <tr>
            <td>${siswa.nama || "-"}</td>
            <td>${siswa.nis || "-"}</td>
            <td>${siswa.kelas || "-"}</td>
            <td>${siswa.tahun_ajaran || "-"}</td>
            <td>${siswa.orang_tua?.nama || siswa.orang_tua?.email || "Belum ditautkan"}</td>
            <td>${siswa.nomor_hp_ortu || "-"}</td>
            <td>
              <button class="btn ghost small" onclick="window.__app.hapusSiswa('${siswa.id}', '${(siswa.nama || "").replace(/'/g, "\\'")}')">
                Hapus
              </button>
            </td>
          </tr>
        `
          )
          .join("");
      }

      function cariSiswa() {
        const input = document.getElementById("cariSiswa");
        if (!input) return;

        const keyword = input.value.toLowerCase().trim();

        const hasil = semuaSiswa.filter((siswa) => {
          const nama = (siswa.nama || "").toLowerCase();
          const nis = (siswa.nis || "").toLowerCase();
          const kelas = (siswa.kelas || "").toLowerCase();
          const tahunAjaran = (siswa.tahun_ajaran || "").toLowerCase();

          return (
            nama.includes(keyword) ||
            nis.includes(keyword) ||
            kelas.includes(keyword) ||
            tahunAjaran.includes(keyword)
          );
        });

        renderDaftarSiswa(hasil);
      }

        } catch (error) {

          alert("Gagal menghapus siswa:\n\n" + error.message);

      async function buatTagihanBulanan() {
        if (!supabase) return alert("Supabase belum terhubung.");

        const bulan = Number(document.getElementById("filterBulanSpp")?.value);
        const tahun = Number(document.getElementById("filterTahunSpp")?.value);
        const inputNominal = prompt(`Nominal SPP untuk ${namaBulan(bulan)} ${tahun}:`, "150000");
        if (inputNominal === null) return;

        const nominal = Number(String(inputNominal).replace(/[^0-9]/g, ""));
        if (!nominal || nominal <= 0) {
          alert("Nominal SPP tidak valid.");
          return;
        }

        if (!confirm(`Buat tagihan SPP ${namaBulan(bulan)} ${tahun} sebesar ${formatRupiah(nominal)} untuk semua siswa yang belum memiliki tagihan pada periode tersebut?`)) return;

        try {
          const { data: siswa, error: siswaError } = await supabase
            .from("siswa")
            .select("id, nama, kelas")
            .order("nama", { ascending: true });
          if (siswaError) throw siswaError;

          const { data: existing, error: existingError } = await supabase
            .from("spp")
            .select("siswa_id")
            .eq("bulan", bulan)
            .eq("tahun", tahun);
          if (existingError) throw existingError;

          const sudahAda = new Set((existing || []).map(x => x.siswa_id));
          const belumAda = (siswa || []).filter(x => !sudahAda.has(x.id));

          if (belumAda.length === 0) {
            alert(`Semua siswa sudah memiliki tagihan SPP ${namaBulan(bulan)} ${tahun}.`);
            return;
          }

          const payload = belumAda.map(x => ({
            siswa_id: x.id,
            bulan,
            tahun,
            nominal,
            status: "Belum Bayar",
            tanggal_bayar: null,
            dicatat_oleh: currentUser ? currentUser.id : null,
          }));

          const { error: insertError } = await supabase.from("spp").insert(payload);
          if (insertError) throw insertError;

          alert(`Berhasil membuat ${payload.length} tagihan SPP untuk ${namaBulan(bulan)} ${tahun}.`);
          await loadSpp();
        } catch (error) {
          console.error("Error buat tagihan bulanan:", error);
          alert("Gagal membuat tagihan bulanan:\n\n" + error.message);
        }
      }

      async function loadSpp() {
        const tbody = document.getElementById("daftarSpp");
        if (!tbody || !supabase) return;

        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Memuat data SPP...</td></tr>`;

        try {
          const bulan = Number(document.getElementById("filterBulanSpp")?.value);
          const tahun = Number(document.getElementById("filterTahunSpp")?.value);
          const status = document.getElementById("filterStatusSpp")?.value;

          let query = supabase
            .from("spp")
            .select("id, nominal, status, siswa:siswa_id ( nama, kelas )")
            .eq("bulan", bulan)
            .eq("tahun", tahun);

          if (status) query = query.eq("status", status);

          const { data, error } = await query.order("created_at", { ascending: false });
          if (error) throw error;

          if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Belum ada data SPP untuk periode ini.</td></tr>`;
            return;
          }

          tbody.innerHTML = data
            .map(

            <tr>
              <td>${s.siswa?.nama || "-"}</td>
              <td>${s.siswa?.kelas || "-"}</td>
              <td class="num">${formatRupiah(s.nominal)}</td>

            </tr>
          `
            )
            .join("");
        } catch (error) {
          console.error("Error load SPP:", error);
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#E11D48;">Gagal memuat data SPP.</td></tr>`;
        }
      }

      async function loadFormInputAbsen() {
        const kelas = document.getElementById("inputAbsenKelas")?.value;

        const tbody = document.getElementById("daftarInputAbsen");
        const btnSimpan = document.getElementById("btnSimpanAbsen");
        if (!tbody) return;

        if (!kelas || !tanggal) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Pilih kelas dan tanggal terlebih dahulu.</td></tr>`;
          if (btnSimpan) btnSimpan.style.display = "none";
          return;
        }

        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Memuat siswa...</td></tr>`;

        try {
          const { data: daftarSiswa, error: siswaError } = await supabase
            .from("siswa")
            .select("id, nama, nis")
            .eq("kelas", kelas)
            .order("nama", { ascending: true });
          if (siswaError) throw siswaError;

          if (!daftarSiswa || daftarSiswa.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Tidak ada siswa di kelas ini.</td></tr>`;
            if (btnSimpan) btnSimpan.style.display = "none";
            return;
          }

          const { data: absensiExisting, error: absensiError } = await supabase
            .from("absensi")
            .select("id, siswa_id, status, keterangan")
            .eq("tanggal", tanggal)
            .in("siswa_id", daftarSiswa.map((s) => s.id));
          if (absensiError) throw absensiError;

          const absensiMap = {};
          (absensiExisting || []).forEach((a) => {
            absensiMap[a.siswa_id] = a;
          });

          tbody.innerHTML = daftarSiswa
            .map((s) => {
              const existing = absensiMap[s.id];
              const statusTerpilih = existing ? existing.status : "H";
              const keteranganNilai = existing ? existing.keterangan || "" : "";
              const opsiStatus = Object.entries(ABSEN_STATUS_LABELS)
                .map(([kode, label]) => `<option value="${kode}" ${kode === statusTerpilih ? "selected" : ""}>${label}</option>`)
                .join("");

              return `
                <tr data-siswa-id="${s.id}" data-absensi-id="${existing ? existing.id : ""}">
                  <td>${s.nama || "-"}</td>
                  <td>${s.nis || "-"}</td>

                </tr>
              `;

            .join("");

          console.error("Error load form absensi:", error);
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#E11D48;">Gagal memuat data siswa.</td></tr>`;
        }

      async function simpanAbsensiMassal() {
        if (!supabase) {
          alert("Supabase belum terhubung.");
          return;
        }

        const tanggal = document.getElementById("inputAbsenTanggal")?.value;
        const btnSimpan = document.getElementById("btnSimpanAbsen");
        const baris = document.querySelectorAll("#daftarInputAbsen tr[data-siswa-id]");

        if (!tanggal || baris.length === 0) {
          alert("Tidak ada data untuk disimpan.");
          return;
        }

        if (btnSimpan) {
          btnSimpan.disabled = true;
          btnSimpan.textContent = "Menyimpan...";
        }

        try {
          const dataUpdate = [];
          const dataInsert = [];

          baris.forEach((tr) => {
            const siswaId = tr.getAttribute("data-siswa-id");
            const absensiId = tr.getAttribute("data-absensi-id");
            const status = tr.querySelector(".absen-status").value;
            const keterangan = tr.querySelector(".absen-keterangan").value.trim();
            const record = {
              siswa_id: siswaId,
              tanggal,
              status,
              keterangan: keterangan || null,
              input_oleh: currentUser ? currentUser.id : null,
            };

            if (absensiId) dataUpdate.push({ id: absensiId, ...record });
            else dataInsert.push(record);
          });

          if (dataInsert.length > 0) {
            const { error } = await supabase.from("absensi").insert(dataInsert);
            if (error) throw error;
          }

          for (const item of dataUpdate) {
            const { id, ...record } = item;
            const { error } = await supabase.from("absensi").update(record).eq("id", id);
            if (error) throw error;
          }

          alert("Absensi berhasil disimpan!");
          await loadFormInputAbsen();
        } catch (error) {
          console.error("Error simpan absensi:", error);
          alert("Gagal menyimpan absensi:\n\n" + error.message);
        } finally {
          if (btnSimpan) {
            btnSimpan.disabled = false;
            btnSimpan.textContent = "Simpan Absensi";
          }
        }
      }

      async function loadGuru() {
        const tbody = document.getElementById("daftarGuru");
        const searchInput = document.getElementById("cariGuru");
        if (!tbody || !supabase) return;
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Memuat data guru...</td></tr>`;
        try {
          const { data, error } = await supabase
            .from("pengguna")
            .select("id, nama, email, role")
            .eq("role", "guru")
            .order("nama", { ascending: true });
          if (error) throw error;
          const keyword = (searchInput?.value || "").toLowerCase().trim();
          const hasil = (data || []).filter(g =>
            (g.nama || "").toLowerCase().includes(keyword) ||
            (g.email || "").toLowerCase().includes(keyword)
          );
          if (!hasil.length) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Belum ada akun guru/pelatih.</td></tr>`;
            return;
          }
          tbody.innerHTML = hasil.map(g => `
            <tr>
              <td>${g.nama || "-"}</td>
              <td>${g.email || "-"}</td>
              <td><span class="badge badge-good">Guru / Pelatih</span></td>
              <td><span class="badge badge-muted">Aktif</span></td>
            </tr>
          `).join("");
          if (searchInput && !searchInput.dataset.bound) {
            searchInput.addEventListener("input", loadGuru);
            searchInput.dataset.bound = "1";
          }
        } catch (error) {
          console.error("Error load guru:", error);
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#E11D48;">Gagal memuat data guru: ${error.message}</td></tr>`;
        }
      }

      async function simpanAbsensiSaya(event) {
        event.preventDefault();
        if (!supabase || !currentUser) return;
        const btn = document.getElementById("btnSimpanAbsensiSaya");
        const tanggal = document.getElementById("guruSayaTanggal")?.value;
        const status = document.getElementById("guruSayaStatus")?.value;
        const keterangan = document.getElementById("guruSayaKeterangan")?.value.trim() || null;
        if (!tanggal) return;
        btn.disabled = true;
        btn.textContent = "Menyimpan...";
        try {
          const { data: existing, error: findError } = await supabase
            .from("absensi_guru")
            .select("id")
            .eq("guru_id", currentUser.id)
            .eq("tanggal", tanggal)
            .maybeSingle();
          if (findError) throw findError;
          if (existing) {
            const { error } = await supabase.from("absensi_guru").update({ status, keterangan }).eq("id", existing.id);
            if (error) throw error;
          } else {
            const { error } = await supabase.from("absensi_guru").insert({ guru_id: currentUser.id, tanggal, status, keterangan });
            if (error) throw error;
          }
          alert("Kehadiran berhasil disimpan.");
          document.getElementById("guruSayaKeterangan").value = "";
          await loadAbsensiSaya();
        } catch (error) {
          console.error("Error simpan absensi guru:", error);
          alert("Gagal menyimpan kehadiran:\n\n" + error.message);
        } finally {
          btn.disabled = false;
          btn.textContent = "Simpan Kehadiran";
        }
      }

      async function loadAbsensiRange(kelasSelectId, dariId, sampaiId, tbodyId) {
        const tbody = document.getElementById(tbodyId);
        if (!tbody || !supabase) return;

        const kelas = document.getElementById(kelasSelectId)?.value;
        const dari = document.getElementById(dariId)?.value;
        const sampai = document.getElementById(sampaiId)?.value;

        if (!dari || !sampai) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Pilih rentang tanggal terlebih dahulu.</td></tr>`;
          return;
        }

        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>`;

        try {
          const { data, error } = await supabase
            .from("absensi")
            .select("tanggal, status, keterangan, siswa:siswa_id ( nama, kelas )")
            .gte("tanggal", dari)
            .lte("tanggal", sampai)
            .order("tanggal", { ascending: false });
          if (error) throw error;

          let hasil = data || [];
          if (kelas) hasil = hasil.filter((a) => a.siswa?.kelas === kelas);

          if (hasil.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Tidak ada data absensi pada rentang ini.</td></tr>`;
            return;
          }

          tbody.innerHTML = hasil
            .map(
              (a) => `
            <tr>
              <td>${a.tanggal || "-"}</td>
              <td>${a.siswa?.nama || "-"}</td>
              <td>${a.siswa?.kelas || "-"}</td>
              <td><span class="badge ${statusBadgeAbsensi(a.status)}">${labelStatusAbsensi(a.status)}</span></td>
              <td>${a.keterangan || "-"}</td>
            </tr>
          `
            )
            .join("");
        } catch (error) {
          console.error("Error load absensi range:", error);
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#E11D48;">Gagal memuat data.</td></tr>`;
        }
      }

      function loadRekapAbsensi() {
        loadAbsensiRange("rekapKelas", "rekapDari", "rekapSampai", "daftarRekapAbsensi");

      function loadRiwayatAbsensi() {
        loadAbsensiRange("riwayatKelas", "riwayatDari", "riwayatSampai", "daftarRiwayatAbsensi");

      let anakOrangTuaList = [];

      async function pastikanAnakOrangTuaDimuat() {
        if (!supabase || !currentUser) return;

        const { data, error } = await supabase
          .from("siswa")
          .select("id, nama, nis, kelas, tahun_ajaran")
          .eq("orang_tua_id", currentUser.id)
          .order("nama", { ascending: true });

        if (error) {

          return;
        }

        anakOrangTuaList = data || [];
        if (!anakTerpilihId && anakOrangTuaList.length > 0) {
          anakTerpilihId = anakOrangTuaList[0].id;
        }

                  <div class="stat c-bad"><div class="num">${hitung.A}</div><div class="lbl">Alpa — ${namaBulan(bulanIni)}</div></div>

                <div style="margin-top:20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">

          console.error("Error load ringkasan anak:", error);

      const ABSEN_STATUS_LABELS = { H: "Hadir", I: "Izin", S: "Sakit", A: "Alpa" };

      function labelStatusAbsensi(kode) {
        return ABSEN_STATUS_LABELS[kode] || kode || "-";

      function statusBadgeAbsensi(status) {
        const map = { H: "badge-good", I: "badge-warn", S: "badge-sick", A: "badge-bad" };

        const n = Number(angka) || 0;

      function downloadCsv(filename, rows) {
        const csv = rows.map(row => row.map(v => { const x = String(v ?? "").replace(/"/g, '""'); return `"${x}"`; }).join(",")).join("\n");
        const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      }

      async function loadNotifikasi(){
        const p=document.getElementById("notifPanel"), c=document.getElementById("notifCount"); if(!p||!supabase||currentUserRole!=="admin") return;
        const items=[];
        try{
          const now=new Date(), b=now.getMonth()+1, t=now.getFullYear(), ds=now.toISOString().slice(0,10);
          const {data:spp}=await supabase.from("spp").select("id").eq("bulan",b).eq("tahun",t).neq("status","Lunas");
          if((spp||[]).length) items.push(`💳 ${spp.length} tagihan SPP bulan ${namaBulan(b)} belum lunas.`);
          const {data:ag}=await supabase.from("absensi_guru").select("guru_id").eq("tanggal",ds);
          const {count:gc}=await supabase.from("pengguna").select("id",{count:"exact",head:true}).eq("role","guru");
          const recorded=new Set((ag||[]).map(x=>x.guru_id));
          if(gc && recorded.size<gc) items.push(`👩‍🏫 ${gc-recorded.size} guru/pelatih belum mengisi absensi hari ini.`);
          const {data:a}=await supabase.from("absensi").select("siswa_id").eq("tanggal",ds);
          const {count:sc}=await supabase.from("siswa").select("id",{count:"exact",head:true});
          if(sc && (a||[]).length<sc) items.push(`📋 Masih ada siswa yang belum memiliki absensi hari ini.`);
        }catch(e){console.error(e)}
        c.textContent=items.length; c.style.display=items.length?"inline-block":"none";
        p.innerHTML=items.length?`<div style="font-weight:700;margin-bottom:6px;">Perlu Perhatian</div>${items.map(x=>`<div class="notif-item">${x}</div>`).join("")}`:`<div style="font-weight:700;">Semua aman ✨</div><div class="notif-item">Belum ada hal yang perlu ditindaklanjuti.</div>`;
      }

      async function init() {
        try {
          if (!supabase) {
            renderLogin();
            return;
          }

          const { data: { session }, error: sessionError } = await supabase.auth.getSession();
          if (sessionError) throw sessionError;

          if (!session) {
            renderLogin();
            return;
          }

          const { data: { user }, error: userError } = await supabase.auth.getUser();
          if (userError || !user) {
            await supabase.auth.signOut();
            renderLogin();
            return;
          }

          const profile = await loadUserProfile(user.id);

          currentUser = profile;
          currentUserRole = profile.role;
          currentNav = NAV_CONFIG[currentUserRole]?.[0]?.id || "dasbor";

          renderApp();
        } catch (error) {
          console.error("Init error:", error);
          if (supabase) await supabase.auth.signOut();
          currentUser = null;
          currentUserRole = null;
          renderLogin();
        }
      }
