<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <title>Gantariku — Absensi &amp; SPP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

      :root {
        --bg: #F4F2FC;
        --surface: #FFFFFF;
        --ink: #211B3B;
        --ink-soft: #6E6690;
        --line: #E7E2F7;
        --primary: #6C4CF1;
        --primary-dark: #4E31D6;
        --primary-soft: #EDE7FD;
        --teal: #0EA5A0;
        --pink: #EC4899;
        --good: #16A34A;
        --good-soft: #DCF7E5;
        --warn: #D97706;
        --warn-soft: #FDECD1;
        --sick: #7C3AED;
        --sick-soft: #EEE5FD;
        --bad: #E11D48;
        --bad-soft: #FCE1E8;
        --muted: #F1EEFA;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2 { font-family: 'Space Grotesk', sans-serif; }

      /* ========== LOGIN PAGE ========== */
      .login-container {
        display: flex;
        min-height: 100vh;
        background: linear-gradient(135deg, #4E31D6 0%, #6C4CF1 50%, #8B5CF6 100%);
      }

      .login-box {
        margin: auto;
        background: var(--surface);
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(33, 27, 59, .3);
      }

      .login-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 30px;
      }

      .login-logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: linear-gradient(135deg, #4E31D6, #6C4CF1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        color: white;
      }

      .login-brand { text-align: left; }

      .login-brand h1 {
        font-size: 24px;
        font-weight: 700;
        margin: 0;
        color: var(--ink);
      }

      .login-brand p {
        font-size: 12px;
        color: var(--ink-soft);
        margin: 4px 0 0;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
      }

      .form-group input,
      .form-group select {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        color: var(--ink);
        background: #fff;
        transition: border-color .2s, box-shadow .2s;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(108, 76, 241, .1);
      }

      .login-btn {
        padding: 10px 16px;
        background: linear-gradient(135deg, #4E31D6, #6C4CF1);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: transform .1s, box-shadow .2s;
      }

      .login-btn:hover { box-shadow: 0 10px 30px rgba(108, 76, 241, .3); }
      .login-btn:active { transform: scale(.95); }
      .login-btn:disabled { opacity: .6; cursor: not-allowed; }

      .error-msg {
        padding: 10px 12px;
        background: var(--bad-soft);
        color: var(--bad);
        border-radius: 8px;
        font-size: 13px;
        display: none;
      }

      .error-msg.show { display: block; }

      .loading-spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, .3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin .8s linear infinite;
        margin-right: 6px;
      }

      @keyframes spin { to { transform: rotate(360deg); } }

      /* ========== APP PAGE ========== */
      .app { display: flex; min-height: 100vh; }

      .sidebar {
        width: 246px;
        flex-shrink: 0;
        background: linear-gradient(180deg, #4E31D6 0%, #6C4CF1 55%, #8B5CF6 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        padding: 24px 18px;
        position: relative;
      }

      /* Wrapper for user-info + nav + sidebar-foot. On desktop this is just
         a normal flex column filling the sidebar; on mobile it becomes a
         collapsible dropdown panel (see media query below). */
      .sidebar-menu {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }

      .mobile-menu-btn {
        display: none;
        width: 36px;
        height: 36px;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 8px;
        background: rgba(255, 255, 255, .15);
        color: #fff;
        font-size: 18px;
        cursor: pointer;
        flex-shrink: 0;
      }

      .mobile-menu-btn:hover { background: rgba(255, 255, 255, .25); }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: rgba(255, 255, 255, .18);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }

      .brand-text {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 16px;
        line-height: 1.1;
      }

      .brand-sub { font-size: 11px; color: rgba(255, 255, 255, .7); }

      .user-info {
        background: rgba(255, 255, 255, .12);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 22px;
        font-size: 12px;
      }

      .user-name { font-weight: 600; color: #fff; }
      .user-role { font-size: 11px; color: rgba(255, 255, 255, .7); margin-top: 2px; }

      .nav { display: flex; flex-direction: column; gap: 3px; }

      .nav-item {
        all: unset;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 11px;
        border-radius: 8px;
        font-size: 13.5px;
        color: rgba(255, 255, 255, .8);
      }

      .nav-item:hover { background: rgba(255, 255, 255, .1); }

      .nav-item.active {
        background: rgba(255, 255, 255, .95);
        color: var(--primary-dark);
        font-weight: 600;
      }

      .sidebar-foot {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-top: 14px;
        font-size: 11px;
        color: rgba(255, 255, 255, .7);
      }

      .conn-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #34D399;
      }

      .logout-btn {
        all: unset;
        cursor: pointer;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, .3);
        color: rgba(255, 255, 255, .8);
        font-size: 12px;
        font-weight: 600;
        transition: background .15s;
        text-align: center;
      }

      .logout-btn:hover { background: rgba(255, 255, 255, .1); }

      .content { flex: 1; min-width: 0; }

      .topbar {
        padding: 26px 34px 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        flex-wrap: wrap;
      }

      .topbar h1 { font-size: 23px; font-weight: 700; margin: 0 0 4px; }
      .topbar p { margin: 0; color: var(--ink-soft); font-size: 13px; }

      .today-chip {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 7px 14px;
        font-size: 12.5px;
        color: var(--ink-soft);
        font-weight: 500;
        white-space: nowrap;
      }

      
      .dash-welcome{background:linear-gradient(135deg,var(--primary-soft) 0%,#fff 72%);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 6px 20px rgba(108,76,241,.06)}
      .dash-welcome h2{margin:0 0 5px;font-size:20px}.dash-welcome p{margin:0;color:var(--ink-soft);line-height:1.5}.dash-welcome-mark{font-size:38px;line-height:1}
      .dash-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.dash-mini{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.dash-mini-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.dash-mini-label{font-size:12px;color:var(--ink-soft)}.dash-mini-num{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;margin-top:5px}.dash-mini-sub{font-size:11px;color:var(--ink-soft);margin-top:4px}.dash-progress{margin-top:9px;height:7px;border-radius:20px;background:var(--muted);overflow:hidden}.dash-progress>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--pink));border-radius:20px;transition:width .4s ease}
      .dash-two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start}.dash-list{display:flex;flex-direction:column;gap:9px}.dash-list-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}.dash-list-main{min-width:0}.dash-list-title{font-weight:600;font-size:13px}.dash-list-sub{font-size:11px;color:var(--ink-soft);margin-top:2px}.dash-pill{font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);white-space:nowrap}

      .dash-class-name{font-weight:700}.dash-class-sub{font-size:11px;color:var(--ink-soft);margin-top:2px}
      .dash-score{font-weight:700;color:var(--primary-dark)}
      .perk-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
      .perk-search{min-width:220px;flex:1}
      .perk-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
      .perk-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px;transition:transform .15s,box-shadow .15s}
      .perk-card:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(33,27,59,.07)}
      .perk-card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}
      .perk-student{font-weight:700;font-size:15px}.perk-class{font-size:11px;color:var(--ink-soft);margin-top:3px}
      .perk-average{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--primary-dark);font-size:18px;white-space:nowrap}
      .perk-aspects{display:grid;gap:7px}.perk-aspect{display:flex;justify-content:space-between;gap:8px;padding:8px 9px;border-radius:10px;background:var(--bg);font-size:12px}.perk-aspect-name{color:var(--ink-soft)}.perk-aspect-score{font-weight:700}
      .perk-note{margin-top:12px;padding:10px 11px;border-radius:10px;background:var(--primary-soft);font-size:12px;line-height:1.5}
      .perk-date{font-size:11px;color:var(--ink-soft);margin-top:10px}
      .perk-empty{padding:36px 18px;text-align:center;color:var(--ink-soft)}
      .perk-pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px}
      .perk-parent-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:16px}
      .perk-parent-aspect{padding:12px;border:1px solid var(--line);border-radius:12px;text-align:center;background:#fff}.perk-parent-aspect .score{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:var(--primary-dark);margin-top:4px}.perk-parent-aspect .name{font-size:11px;color:var(--ink-soft);line-height:1.3}
      .perk-history{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.perk-history-title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.perk-history-select{min-width:240px;max-width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit}.perk-history-panel{margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}.perk-history-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.perk-history-cell{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;text-align:center}.perk-history-cell .name{font-size:11px;color:var(--ink-soft)}.perk-history-cell .score{font-family:"Space Grotesk",sans-serif;font-size:18px;font-weight:700;color:var(--primary);margin-top:3px}.perk-history-meta{font-size:11px;color:var(--ink-soft);margin-top:10px}.perk-history-note{font-size:12px;line-height:1.5;margin-top:8px}


.view { padding: 6px 34px 50px; max-width: 1160px; }

      .stat-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 22px;
      }

      .stat {
        background: var(--surface);
        border-radius: 14px;
        padding: 16px 18px;
        border-left: 4px solid var(--primary);
        box-shadow: 0 1px 2px rgba(33, 27, 59, .05);
      }

      .stat.c-teal { border-left-color: var(--teal); }
      .stat.c-good { border-left-color: var(--good); }
      .stat.c-bad { border-left-color: var(--bad); }
      .stat.c-pink { border-left-color: var(--pink); }
      .stat.c-warn { border-left-color: var(--warn); }
      .stat.c-sick { border-left-color: var(--sick); }

      .stat .num {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 25px;
        font-weight: 700;
        line-height: 1.1;
      }

      .stat .lbl { font-size: 12px; color: var(--ink-soft); margin-top: 5px; }

      .section {
        background: var(--surface);
        border-radius: 16px;
        margin-bottom: 20px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(33, 27, 59, .05);
      }

      .section-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .section-head h2 { font-size: 16px; font-weight: 700; margin: 0; }
      .section-body { padding: 18px 20px; }

      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      input[type=text],
      input[type=email],
      input[type=password],
      input[type=date],
      input[type=number],
      select {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
      }

      input[type=text]:focus,
      input[type=email]:focus,
      input[type=password]:focus,
      input[type=date]:focus,
      input[type=number]:focus,
      select:focus {
        outline: 2px solid var(--primary);
        outline-offset: 1px;
        background: #fff;
      }

      .btn {
        all: unset;
        cursor: pointer;
        padding: 8px 15px;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        font-size: 12.5px;
        transition: background .15s, transform .1s;
      }

      .btn:hover { background: var(--primary-dark); }
      .btn:active { transform: scale(.97); }
      .btn.secondary { background: var(--primary-soft); color: var(--primary-dark); }

      .btn.ghost {
        background: transparent;
        color: var(--ink-soft);
        border: 1px solid var(--line);
      }

      .btn.small { padding: 6px 11px; font-size: 11.5px; }

      table { width: 100%; border-collapse: collapse; }

      th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .03em;
        color: var(--ink-soft);
        font-weight: 600;
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
      }

      td {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        font-size: 13.5px;
      }

      tbody tr:hover { background: var(--bg); }
      tr:last-child td { border-bottom: none; }

      td.num, th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 600;
      }

      .badge-good { background: var(--good-soft); color: var(--good); }
      .badge-warn { background: var(--warn-soft); color: var(--warn); }
      .badge-sick { background: var(--sick-soft); color: var(--sick); }
      .badge-bad { background: var(--bad-soft); color: var(--bad); }
      .badge-muted { background: var(--muted); color: var(--ink-soft); }

      .empty {
        padding: 34px;
        text-align: center;
        color: var(--ink-soft);
        font-size: 13px;
      }


      .notif-panel{display:none;position:absolute;right:20px;top:58px;width:min(360px,calc(100vw - 40px));background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 45px rgba(33,27,59,.18);z-index:100;padding:14px}
      .notif-panel.show{display:block}
      .notif-item{padding:10px 8px;border-bottom:1px solid var(--line);font-size:12.5px;line-height:1.45}
      .notif-item:last-child{border-bottom:none}

      @media (max-width: 900px) {
        .stat-row { grid-template-columns: repeat(2, 1fr); }
      }

      @media (max-width: 900px) {
        .dash-summary{grid-template-columns:1fr 1fr}
        .dash-two-col{grid-template-columns:1fr}
        .perk-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
        .perk-parent-summary{grid-template-columns:repeat(3,minmax(0,1fr))}
      }

      @media (max-width: 760px) {
        .app { flex-direction: column; }

        .sidebar {
          width: 100%;
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          padding: 12px 16px;
        }

        .brand { margin-bottom: 0; }

        .mobile-menu-btn { display: flex; }

        /* Collapsed by default on mobile: shown as a dropdown panel

        .sidebar-menu {
          display: none;
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          background: var(--primary-dark);
          padding: 14px 16px 18px;
          box-shadow: 0 14px 30px rgba(33, 27, 59, .35);
          z-index: 30;
          max-height: calc(100vh - 60px);
          overflow-y: auto;
        }

        .sidebar.mobile-open .sidebar-menu { display: flex; }

        .user-info { margin-bottom: 14px; }

        .sidebar-foot { padding-top: 10px; }

        .view, .topbar { padding-left: 18px; padding-right: 18px; }

        .stat-row { grid-template-columns: 1fr 1fr; }
        .dash-summary{grid-template-columns:1fr}.dash-welcome{padding:16px}.dash-welcome h2{font-size:18px}.dash-welcome-mark{font-size:31px}
        .perk-grid{grid-template-columns:1fr}.perk-parent-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.perk-search{min-width:0;width:100%}

        .login-box { padding: 30px 20px; max-width: calc(100% - 40px); }
      }

      // ============================================================

      async function loadUserProfile(userId) {
        if (!supabase) throw new Error("Supabase belum dikonfigurasi");

        const { data, error } = await supabase
          .from("pengguna")
          .select("id, user_id, nama, email, role")
          .eq("user_id", userId)
          .single();

        if (error) {
          console.error("Profile error:", error);
          throw new Error("Profil pengguna tidak ditemukan atau tidak dapat diakses.");
        }
        if (!data) throw new Error("Profil pengguna tidak ditemukan.");

        return data;
      }

      // ============================================================
      // LOGIN HANDLER
      // ============================================================
      async function handleLogin(e) {
        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const errorEl = document.getElementById("loginError");
        const btnEl = document.getElementById("loginBtn");
        const btnText = document.getElementById("loginBtnText");

        errorEl.textContent = "";
        errorEl.classList.remove("show");

        if (!email || !password) {
          errorEl.textContent = "Email dan password harus diisi.";
          errorEl.classList.add("show");
          return;
        }

        btnEl.disabled = true;
        btnText.innerHTML = '<span class="loading-spinner"></span>Memproses...';

        try {
          if (!supabase) throw new Error("Tidak dapat terhubung ke server. Periksa koneksi internet Anda, lalu muat ulang halaman.");

          const { data: authData, error: authError } = await supabase.auth.signInWithPassword({ email, password });
          if (authError) throw new Error("Email atau password salah.");
          if (!authData.user) throw new Error("User tidak ditemukan.");

          const profile = await loadUserProfile(authData.user.id);

          currentUser = profile;
          currentUserRole = profile.role;
          currentNav = NAV_CONFIG[currentUserRole]?.[0]?.id || "dasbor";

          renderApp();
        } catch (error) {
          console.error("Login error:", error);
          if (supabase) await supabase.auth.signOut();
          errorEl.textContent = error.message || "Terjadi kesalahan saat login.";
          errorEl.classList.add("show");
        } finally {
          btnEl.disabled = false;
          btnText.textContent = "Masuk";
        }
      }

      async function logout() {
        try {
          if (supabase) {
            const { error } = await supabase.auth.signOut();
            if (error) console.error("Logout error:", error);
          }
        } catch (error) {
          console.error("Logout error:", error);
        } finally {
          currentUser = null;
          currentUserRole = null;
          currentNav = "dasbor";
          anakOrangTuaList = [];
          anakTerpilihId = null;
          renderLogin();
        }
      }

      async function loadDasbor() {
        if (!supabase || currentUserRole !== "admin") return;
        const today=new Date(), todayStr=today.toISOString().slice(0,10), bulanIni=today.getMonth()+1, tahunIni=today.getFullYear();
        const lblLunas=document.getElementById("lblLunas"), lblBelumBayar=document.getElementById("lblBelumBayar");
        if(lblLunas)lblLunas.textContent=`Lunas SPP — ${namaBulan(bulanIni)}`; if(lblBelumBayar)lblBelumBayar.textContent=`Belum bayar — ${namaBulan(bulanIni)}`;
        try{
          const [{data:siswaData,count:totalSiswa},{data:absensiHariIni,error:absensiError},{data:sppBulanIni,error:sppError}]=await Promise.all([
            supabase.from("siswa").select("id,nama,kelas",{count:"exact"}).order("nama"),
            supabase.from("absensi").select("status,siswa_id,siswa:siswa_id(nama,kelas)").eq("tanggal",todayStr),
            supabase.from("spp").select("status,nominal,siswa_id,siswa:siswa_id(kelas)").eq("bulan",bulanIni).eq("tahun",tahunIni)
          ]); if(absensiError)throw absensiError; if(sppError)throw sppError;
          const siswa=siswaData||[], total=totalSiswa||siswa.length, hadirCount=(absensiHariIni||[]).filter(a=>a.status==="H").length, persenHadir=total?Math.round(hadirCount/total*100):0;
          document.getElementById("dashTotalSiswa")?.replaceChildren(document.createTextNode(String(total))); document.getElementById("statHadir")?.replaceChildren(document.createTextNode(`${hadirCount}/${total}`)); document.getElementById("dashPersenHadir")?.replaceChildren(document.createTextNode(`${persenHadir}%`));
          const sh=document.getElementById("dashHadirSub"); if(sh)sh.textContent=`${hadirCount} dari ${total} siswa tercatat hadir`; const pr=document.getElementById("dashHadirProgress"); if(pr)pr.style.width=`${persenHadir}%`;
          const lunas=(sppBulanIni||[]).filter(s=>s.status==="Lunas"), belumBayar=(sppBulanIni||[]).filter(s=>s.status!=="Lunas"), tunggakan=belumBayar.reduce((sum,s)=>sum+(Number(s.nominal)||0),0), pemasukan=lunas.reduce((sum,s)=>sum+(Number(s.nominal)||0),0);
          document.getElementById("statLunas")?.replaceChildren(document.createTextNode(String(lunas.length))); document.getElementById("statBelumBayar")?.replaceChildren(document.createTextNode(String(belumBayar.length))); document.getElementById("statTunggakan")?.replaceChildren(document.createTextNode(formatRupiah(tunggakan))); document.getElementById("dashPemasukan")?.replaceChildren(document.createTextNode(formatRupiah(pemasukan)));
          const sp=document.getElementById("dashPemasukanSub"); if(sp)sp.textContent=`${lunas.length} tagihan SPP lunas · ${namaBulan(bulanIni)}`;
          const classMap={}; siswa.forEach(s=>{const k=s.kelas||"Tanpa Kelas"; classMap[k]??={total:0,hadir:0,tercatat:0,lunas:0}; classMap[k].total++;});
          (absensiHariIni||[]).forEach(a=>{const k=a.siswa?.kelas||"Tanpa Kelas"; classMap[k]??={total:0,hadir:0,tercatat:0,lunas:0}; classMap[k].tercatat++; if(a.status==="H")classMap[k].hadir++;});
          (sppBulanIni||[]).forEach(a=>{const k=a.siswa?.kelas||"Tanpa Kelas"; classMap[k]??={total:0,hadir:0,tercatat:0,lunas:0}; if(a.status==="Lunas")classMap[k].lunas++;});
          const entries=Object.entries(classMap).sort((a,b)=>a[0].localeCompare(b[0],'id')), tbody=document.getElementById("tbodyKondisiKelas");
          if(tbody)tbody.innerHTML=entries.length?entries.map(([k,v])=>{const pct=v.total?Math.round(v.hadir/v.total*100):0;return `<tr><td><div class="dash-class-name">${k}</div><div class="dash-class-sub">${v.total} siswa</div></td><td class="num">${v.total}</td><td class="num">${v.hadir}</td><td class="num">${v.tercatat}</td><td class="num"><span class="dash-score">${pct}%</span></td><td class="num">${v.lunas}</td></tr>`}).join(""):`<tr><td colspan="6" style="text-align:center;">Belum ada data kelas.</td></tr>`;
          const kc=document.getElementById("dashKelasCount"); if(kc)kc.textContent=`${entries.length} kelas`;
        }catch(error){console.error("Error load dasbor:",error);}
      }

      async function loadPerhatian() {
        if (!supabase || currentUserRole !== "admin") return;
        const body = document.getElementById("perhatianBody");
        const status = document.getElementById("perhatianStatus");
        if (!body) return;

        try {
          const now = new Date();
          const bulan = now.getMonth() + 1;
          const tahun = now.getFullYear();
          const todayStr = now.toISOString().slice(0, 10);

          const [{ data: siswa }, { data: spp }, { data: absensi }, { data: guru }, { data: absensiGuru }] = await Promise.all([
            supabase.from("siswa").select("id, nama, kelas"),
            supabase.from("spp").select("siswa_id, status, nominal").eq("bulan", bulan).eq("tahun", tahun),
            supabase.from("absensi").select("siswa_id, status").eq("tanggal", todayStr),
            supabase.from("pengguna").select("id, nama").eq("role", "guru"),
            supabase.from("absensi_guru").select("guru_id").eq("tanggal", todayStr),
          ]);

          const tagihanBelum = (spp || []).filter(x => x.status !== "Lunas").length;
          const siswaIds = new Set((absensi || []).map(x => x.siswa_id));
          const belumAbsenSiswa = (siswa || []).filter(x => !siswaIds.has(x.id));
          const guruIds = new Set((absensiGuru || []).map(x => x.guru_id));
          const belumAbsenGuru = (guru || []).filter(x => !guruIds.has(x.id));

          const items = [];
          if (tagihanBelum > 0) items.push(`<div style="padding:10px 12px;border-radius:10px;background:var(--bad-soft);margin-bottom:8px;">💳 <strong>${tagihanBelum}</strong> tagihan SPP ${namaBulan(bulan)} belum lunas.</div>`);
          if (belumAbsenSiswa.length > 0) items.push(`<div style="padding:10px 12px;border-radius:10px;background:var(--warn-soft);margin-bottom:8px;">👧 <strong>${belumAbsenSiswa.length}</strong> siswa belum tercatat absensinya hari ini.</div>`);
          if (belumAbsenGuru.length > 0) items.push(`<div style="padding:10px 12px;border-radius:10px;background:var(--primary-soft);margin-bottom:8px;">👩‍🏫 <strong>${belumAbsenGuru.length}</strong> guru/pelatih belum mengisi absensi hari ini.</div>`);

          if (items.length === 0) {
            body.innerHTML = `<div style="padding:12px;border-radius:10px;background:var(--good-soft);color:var(--good);font-weight:600;">🎉 Semua terlihat aman. Tidak ada hal penting yang perlu ditindaklanjuti.</div>`;
            if (status) { status.textContent = "Aman"; status.className = "badge badge-good"; }
          } else {

      async function buatTagihanBulanan() {
        if (!supabase) return alert("Supabase belum terhubung.");

        const bulan = Number(document.getElementById("filterBulanSpp")?.value);
        const tahun = Number(document.getElementById("filterTahunSpp")?.value);
        const inputNominal = prompt(`Nominal SPP untuk ${namaBulan(bulan)} ${tahun}:`, "150000");
        if (inputNominal === null) return;

        const nominal = Number(String(inputNominal).replace(/[^0-9]/g, ""));
        if (!nominal || nominal <= 0) {
          alert("Nominal SPP tidak valid.");
          return;
        }

        if (!confirm(`Buat tagihan SPP ${namaBulan(bulan)} ${tahun} sebesar ${formatRupiah(nominal)} untuk semua siswa yang belum memiliki tagihan pada periode tersebut?`)) return;

        try {
          const { data: siswa, error: siswaError } = await supabase
            .from("siswa")
            .select("id, nama, kelas")
            .order("nama", { ascending: true });
          if (siswaError) throw siswaError;

          const { data: existing, error: existingError } = await supabase
            .from("spp")
            .select("siswa_id")
            .eq("bulan", bulan)
            .eq("tahun", tahun);
          if (existingError) throw existingError;

          const sudahAda = new Set((existing || []).map(x => x.siswa_id));
          const belumAda = (siswa || []).filter(x => !sudahAda.has(x.id));

          if (belumAda.length === 0) {
            alert(`Semua siswa sudah memiliki tagihan SPP ${namaBulan(bulan)} ${tahun}.`);
            return;
          }

          const payload = belumAda.map(x => ({
            siswa_id: x.id,
            bulan,
            tahun,
            nominal,
            status: "Belum Bayar",
            tanggal_bayar: null,
            dicatat_oleh: currentUser ? currentUser.id : null,
          }));

          const { error: insertError } = await supabase.from("spp").insert(payload);
          if (insertError) throw insertError;

          alert(`Berhasil membuat ${payload.length} tagihan SPP untuk ${namaBulan(bulan)} ${tahun}.`);
          await loadSpp();
        } catch (error) {
          console.error("Error buat tagihan bulanan:", error);
          alert("Gagal membuat tagihan bulanan:\n\n" + error.message);
        }
      }

      async function loadSpp() {
        const tbody = document.getElementById("daftarSpp");
        if (!tbody || !supabase) return;

        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Memuat data SPP...</td></tr>`;

        try {
          const bulan = Number(document.getElementById("filterBulanSpp")?.value);
          const tahun = Number(document.getElementById("filterTahunSpp")?.value);
          const status = document.getElementById("filterStatusSpp")?.value;

          let query = supabase
            .from("spp")
            .select("id, nominal, status, siswa:siswa_id ( nama, kelas )")
            .eq("bulan", bulan)
            .eq("tahun", tahun);

          if (status) query = query.eq("status", status);

          const { data, error } = await query.order("created_at", { ascending: false });
          if (error) throw error;

          if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Belum ada data SPP untuk periode ini.</td></tr>`;
            return;
          }

          tbody.innerHTML = data
            .map(
              (s) => `
            <tr>
              <td>${s.siswa?.nama || "-"}</td>
              <td>${s.siswa?.kelas || "-"}</td>
              <td class="num">${formatRupiah(s.nominal)}</td>
              <td><span class="badge ${s.status === "Lunas" ? "badge-good" : "badge-bad"}">${s.status}</span></td>
              <td>
                ${

                       <button class="btn ghost small" onclick="window.__app.hapusSpp('${s.id}')">Hapus</button>`
                }
              </td>
            </tr>
          `
            )
            .join("");
        } catch (error) {
          console.error("Error load SPP:", error);
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#E11D48;">Gagal memuat data SPP.</td></tr>`;
        }
      }

          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Pilih kelas dan tanggal terlebih dahulu.</td></tr>`;
          if (btnSimpan) btnSimpan.style.display = "none";
          return;
        }

        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Memuat siswa...</td></tr>`;

        try {
          const { data: daftarSiswa, error: siswaError } = await supabase
            .from("siswa")
            .select("id, nama, nis")
            .eq("kelas", kelas)
            .order("nama", { ascending: true });
          if (siswaError) throw siswaError;

          if (!daftarSiswa || daftarSiswa.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Tidak ada siswa di kelas ini.</td></tr>`;
            if (btnSimpan) btnSimpan.style.display = "none";
            return;
          }

          const { data: absensiExisting, error: absensiError } = await supabase
            .from("absensi")
            .select("id, siswa_id, status, keterangan")
            .eq("tanggal", tanggal)
            .in("siswa_id", daftarSiswa.map((s) => s.id));
          if (absensiError) throw absensiError;

          const absensiMap = {};
          (absensiExisting || []).forEach((a) => {
            absensiMap[a.siswa_id] = a;
          });

          tbody.innerHTML = daftarSiswa
            .map((s) => {
              const existing = absensiMap[s.id];
              const statusTerpilih = existing ? existing.status : "H";
              const keteranganNilai = existing ? existing.keterangan || "" : "";
              const opsiStatus = Object.entries(ABSEN_STATUS_LABELS)
                .map(([kode, label]) => `<option value="${kode}" ${kode === statusTerpilih ? "selected" : ""}>${label}</option>`)
                .join("");

              return `
                <tr data-siswa-id="${s.id}" data-absensi-id="${existing ? existing.id : ""}">
                  <td>${s.nama || "-"}</td>
                  <td>${s.nis || "-"}</td>
                  <td><select class="absen-status">${opsiStatus}</select></td>
                  <td><input type="text" class="absen-keterangan" value="${keteranganNilai}" placeholder="Opsional"></td>
                </tr>
              `;
            })
            .join("");

          if (btnSimpan) btnSimpan.style.display = "inline-block";
        } catch (error) {
          console.error("Error load form absensi:", error);
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#E11D48;">Gagal memuat data siswa.</td></tr>`;
        }
      }

      async function simpanAbsensiMassal() {
        if (!supabase) {
          alert("Supabase belum terhubung.");
          return;
        }

        const tanggal = document.getElementById("inputAbsenTanggal")?.value;
        const btnSimpan = document.getElementById("btnSimpanAbsen");
        const baris = document.querySelectorAll("#daftarInputAbsen tr[data-siswa-id]");

        if (!tanggal || baris.length === 0) {
          alert("Tidak ada data untuk disimpan.");
          return;
        }

        if (btnSimpan) {
          btnSimpan.disabled = true;
          btnSimpan.textContent = "Menyimpan...";
        }

        try {
          const dataUpdate = [];
          const dataInsert = [];

          baris.forEach((tr) => {
            const siswaId = tr.getAttribute("data-siswa-id");
            const absensiId = tr.getAttribute("data-absensi-id");
            const status = tr.querySelector(".absen-status").value;
            const keterangan = tr.querySelector(".absen-keterangan").value.trim();
            const record = {
              siswa_id: siswaId,
              tanggal,
              status,
              keterangan: keterangan || null,
              input_oleh: currentUser ? currentUser.id : null,
            };

            if (absensiId) dataUpdate.push({ id: absensiId, ...record });
            else dataInsert.push(record);
          });

          if (dataInsert.length > 0) {
            const { error } = await supabase.from("absensi").insert(dataInsert);
            if (error) throw error;
          }

          for (const item of dataUpdate) {
            const { id, ...record } = item;
            const { error } = await supabase.from("absensi").update(record).eq("id", id);
            if (error) throw error;
          }

          alert("Absensi berhasil disimpan!");
          await loadFormInputAbsen();
        } catch (error) {
          console.error("Error simpan absensi:", error);
          alert("Gagal menyimpan absensi:\n\n" + error.message);
        } finally {
          if (btnSimpan) {
            btnSimpan.disabled = false;
            btnSimpan.textContent = "Simpan Absensi";
          }
        }
      }

      async function loadAbsensiRange(kelasSelectId, dariId, sampaiId, tbodyId) {
        const tbody = document.getElementById(tbodyId);
        if (!tbody || !supabase) return;

        const kelas = document.getElementById(kelasSelectId)?.value;
        const dari = document.getElementById(dariId)?.value;
        const sampai = document.getElementById(sampaiId)?.value;

        if (!dari || !sampai) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Pilih rentang tanggal terlebih dahulu.</td></tr>`;
          return;
        }

        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>`;

        try {
          const { data, error } = await supabase
            .from("absensi")
            .select("tanggal, status, keterangan, siswa:siswa_id ( nama, kelas )")
            .gte("tanggal", dari)
            .lte("tanggal", sampai)
            .order("tanggal", { ascending: false });
          if (error) throw error;

          let hasil = data || [];
          if (kelas) hasil = hasil.filter((a) => a.siswa?.kelas === kelas);

          if (hasil.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Tidak ada data absensi pada rentang ini.</td></tr>`;
            return;
          }

          tbody.innerHTML = hasil
            .map(
              (a) => `
            <tr>
              <td>${a.tanggal || "-"}</td>
              <td>${a.siswa?.nama || "-"}</td>
              <td>${a.siswa?.kelas || "-"}</td>
              <td><span class="badge ${statusBadgeAbsensi(a.status)}">${labelStatusAbsensi(a.status)}</span></td>
              <td>${a.keterangan || "-"}</td>
            </tr>
          `
            )
            .join("");
        } catch (error) {
          console.error("Error load absensi range:", error);
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#E11D48;">Gagal memuat data.</td></tr>`;
        }
      }

      let perkembanganAdminData=[]; let perkembanganAdminPage=1; const PERK_PAGE_SIZE=12;
      function opsiBulanPerkembangan(){const n=new Date();return ["Semua bulan","Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"].map((m,i)=>`<option value="${i===0?0:i}" ${i===n.getMonth()+1?'selected':''}>${m}</option>`).join("");}
      function renderPerkembanganAdmin(){const tahun=new Date().getFullYear();return `<div class="section"><div class="section-head"><div><h2>Perkembangan Anak</h2><div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">Satu kartu mewakili satu anak agar tetap nyaman saat jumlah siswa bertambah.</div></div><div class="perk-toolbar"><input class="perk-search" type="text" id="perkembanganAdminCari" placeholder="Cari nama siswa..."><select id="perkembanganAdminKelas"><option value="">Semua kelas</option></select><select id="perkembanganAdminBulan">${opsiBulanPerkembangan()}</select><select id="perkembanganAdminTahun"><option value="${tahun}">${tahun}</option><option value="${tahun-1}">${tahun-1}</option></select><button class="btn secondary" onclick="window.__app.loadPerkembanganAdmin()">Tampilkan</button><button class="btn secondary" onclick="window.__app.exportPerkembanganCsv()">&#8595; Export CSV</button></div></div><div class="section-body"><div id="perkembanganAdminGrid"><div class="perk-empty">Memuat data perkembangan...</div></div><div class="perk-pagination" id="perkembanganPagination"></div></div></div>`;}
      function renderPerkembanganAdminCards(){const grid=document.getElementById("perkembanganAdminGrid"),pag=document.getElementById("perkembanganPagination");if(!grid)return;const search=(document.getElementById("perkembanganAdminCari")?.value||"").toLowerCase().trim(),kelas=document.getElementById("perkembanganAdminKelas")?.value||"";const items=perkembanganAdminData.filter(x=>(!kelas||x.kelas===kelas)&&(!search||x.nama.toLowerCase().includes(search)));const pages=Math.max(1,Math.ceil(items.length/PERK_PAGE_SIZE));if(perkembanganAdminPage>pages)perkembanganAdminPage=pages;const slice=items.slice((perkembanganAdminPage-1)*PERK_PAGE_SIZE,perkembanganAdminPage*PERK_PAGE_SIZE);grid.innerHTML=slice.length?`<div class="perk-grid">${slice.map(item=>{const vals=PERKEMBANGAN_ASPEK.map(a=>item.aspekMap[a]?.nilai).filter(v=>Number(v)>0),avg=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):"-";return `<div class="perk-card"><div class="perk-card-top"><div><div class="perk-student">${item.nama}</div><div class="perk-class">${item.kelas||"Tanpa kelas"} · ${item.latestDate||"-"}</div></div><div class="perk-average">${avg}${avg!=="-"?"/5":""}</div></div><div class="perk-aspects">${PERKEMBANGAN_ASPEK.map(a=>`<div class="perk-aspect"><span class="perk-aspect-name">${a}</span><span class="perk-aspect-score">${item.aspekMap[a]?`${item.aspekMap[a].nilai}/5`:'—'}</span></div>`).join("")}</div><div class="perk-note">${item.latestNote||"Belum ada catatan tambahan."}</div><div class="perk-date">Pelatih: ${item.latestGuru||"-"}</div></div>`}).join("")}</div>`:`<div class="perk-empty">Belum ada data perkembangan untuk filter ini.</div>`;if(pag)pag.innerHTML=pages>1?`<button class="btn ghost small" ${perkembanganAdminPage===1?'disabled':''} onclick="window.__app.changePerkPage(-1)">&#8592; Sebelumnya</button><span style="font-size:12px;color:var(--ink-soft);">Halaman ${perkembanganAdminPage} / ${pages}</span><button class="btn ghost small" ${perkembanganAdminPage===pages?'disabled':''} onclick="window.__app.changePerkPage(1)">Berikutnya &#8594;</button>`:"";}

      function renderPerkembanganAnak(){return `<div id="pilihAnakWrap"></div><div class="section"><div class="section-head"><div><h2>Perkembangan Anak</h2><div style="font-size:12px;color:var(--ink-soft);margin-top:4px;">Ringkasan dibuat per anak agar mudah dibaca.</div></div></div><div class="section-body"><div id="ringkasanPerkembangan"><div class="empty">Memuat data...</div></div></div></div>`;}
      function formatPeriodePerkembangan(periode) {
        const [tahun, bulan] = periode.split("-").map(Number);
        return `${namaBulan(bulan)} ${tahun}`;
      }

      function renderRiwayatPerkembanganDipilih(periode) {
        const panel = document.getElementById("perkembanganRiwayatPanel");
        if (!panel) return;

        const rows = riwayatPerkembanganAnakData[periode] || [];
        if (!rows.length) {
          panel.innerHTML = `<div class="empty">Belum ada penilaian pada periode ini.</div>`;
          return;
        }

        const nilaiMap = {};
        rows.forEach((r) => {
          if (!nilaiMap[r.aspek]) nilaiMap[r.aspek] = r;
        });

        const vals = PERKEMBANGAN_ASPEK
          .map((a) => Number(nilaiMap[a]?.nilai) || 0)
          .filter(Boolean);
        const avg = vals.length
          ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1)
          : "-";
        const note = rows.find((r) => r.catatan)?.catatan || "Tidak ada catatan tambahan.";

        panel.innerHTML = `
          <div class="perk-history-grid">
            ${PERKEMBANGAN_ASPEK.map((a) => `
              <div class="perk-history-cell">

              </div>
            `).join("")}
          </div>
          <div class="perk-history-meta">
            ${formatPeriodePerkembangan(periode)} · ${guru} · Rata-rata ${avg}/5
          </div>
          <div class="perk-history-note">
            <strong>Catatan:</strong> ${note}
          </div>

      }

      let riwayatPerkembanganAnakData = {};

      async function exportPerkembanganCsv(){
        if(!supabase || currentUserRole!=="admin") return;
        const bulan=Number(document.getElementById("perkembanganAdminBulan")?.value || 0);
        const tahun=Number(document.getElementById("perkembanganAdminTahun")?.value || new Date().getFullYear());
        const kelas=document.getElementById("perkembanganAdminKelas")?.value || "";
        const search=(document.getElementById("perkembanganAdminCari")?.value || "").trim().toLowerCase();
        let q=supabase.from("perkembangan").select("tanggal,aspek,nilai,catatan,siswa:siswa_id(nama,nis,kelas),guru:guru_id(nama)").order("tanggal",{ascending:false}).order("created_at",{ascending:false});
        if(bulan){
          const awal=`${tahun}-${String(bulan).padStart(2,'0')}-01`;
          const akhirD=new Date(tahun,bulan,0).getDate();
          const akhir=`${tahun}-${String(bulan).padStart(2,'0')}-${String(akhirD).padStart(2,'0')}`;
          q=q.gte("tanggal",awal).lte("tanggal",akhir);
        }else{
          q=q.gte("tanggal",`${tahun}-01-01`).lte("tanggal",`${tahun}-12-31`);
        }
        const {data,error}=await q;
        if(error){ alert("Gagal export perkembangan: "+error.message); return; }
        const filtered=(data||[]).filter(x=>
          (!kelas || x.siswa?.kelas===kelas) &&
          (!search || (x.siswa?.nama||"").toLowerCase().includes(search))
        );
        const rows=[["Tanggal","Nama","NIS","Kelas","Aspek","Nilai","Pelatih","Catatan"]];
        filtered.forEach(x=>rows.push([
          x.tanggal||"",x.siswa?.nama||"",x.siswa?.nis||"",x.siswa?.kelas||"",
          x.aspek||"",x.nilai||"",x.guru?.nama||"",x.catatan||""
        ]));
        const periode=bulan?`${tahun}-${String(bulan).padStart(2,'0')}`:String(tahun);
        downloadCsv(`gantariku-perkembangan-${periode}.csv`,rows);
      }

      async function loadPerkembanganAnak() {
        const wrap = document.getElementById("pilihAnakWrap");
        const body = document.getElementById("ringkasanPerkembangan");
        if (!body || !supabase) return;

        await pastikanAnakOrangTuaDimuat();
        if (wrap) wrap.innerHTML = renderPilihAnakHtml();

        const anak = anakYangDipilih();
        if (!anak) {
          body.innerHTML = `<div class="empty">Belum ada siswa yang terhubung dengan akun ini.</div>`;
          return;
        }

        try {
          const now = new Date();
          const bulan = now.getMonth() + 1;
          const tahun = now.getFullYear();
          const awal = `${tahun}-${String(bulan).padStart(2, "0")}-01`;
          const akhirD = new Date(tahun, bulan, 0).getDate();
          const akhir = `${tahun}-${String(bulan).padStart(2, "0")}-${String(akhirD).padStart(2, "0")}`;

          const { data, error } = await supabase
            .from("perkembangan")
            .select("tanggal,aspek,nilai,catatan,guru:guru_id(nama),created_at")
            .eq("siswa_id", anak.id)
            .order("tanggal", { ascending: false })
            .order("created_at", { ascending: false })
            .limit(200);
          if (error) throw error;

          const month = (data || []).filter((x) => x.tanggal >= awal && x.tanggal <= akhir);
          const latest = {};
          let note = "";
          let date = "";
          let guru = "";

          for (const x of month) {
            if (!latest[x.aspek]) latest[x.aspek] = x;
            if (!date) {
              date = x.tanggal;
              guru = x.guru?.nama || "Pelatih";
            }
            if (!note && x.catatan) note = x.catatan;
          }

          const vals = PERKEMBANGAN_ASPEK
            .map((a) => latest[a]?.nilai)
            .filter((v) => Number(v) > 0);
          const avg = vals.length
            ? (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1)
            : "-";

          const historyMap = new Map();
          for (const x of data || []) {
            const periode = (x.tanggal || "").slice(0, 7);
            if (!periode) continue;
            if (!historyMap.has(periode)) historyMap.set(periode, []);
            historyMap.get(periode).push(x);
          }

          riwayatPerkembanganAnakData = {};
          for (const [periode, rows] of historyMap.entries()) {
            riwayatPerkembanganAnakData[periode] = rows;
          }

          const histPeriods = [...historyMap.keys()].sort((a, b) => b.localeCompare(a)).slice(0, 12);
          const currentPeriod = `${tahun}-${String(bulan).padStart(2, "0")}`;
          const defaultHistory = histPeriods.find((p) => p < currentPeriod) || histPeriods[0] || "";

          const historySelect = histPeriods.length
            ? `
              <select
                class="perk-history-select"
                id="pilihRiwayatPerkembangan"
                onchange="window.__app.tampilkanRiwayatPerkembangan(this.value)"
              >
                ${histPeriods.map((p) => `
                  <option value="${p}" ${p === defaultHistory ? "selected" : ""}>
                    ${formatPeriodePerkembangan(p)}
                  </option>
                `).join("")}
              </select>
            `
            : `
              <span style="font-size:12px;color:var(--ink-soft);">Belum ada riwayat</span>
            `;

          body.innerHTML = `
            <div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;">
              <div>
                <h3 style="margin:0 0 5px;">${anak.nama}</h3>
                <div style="font-size:12px;color:var(--ink-soft);">
                  ${anak.kelas || "Tanpa kelas"} · ${namaBulan(bulan)} ${tahun}
                </div>
              </div>
              <div class="badge badge-good">Rata-rata ${avg}${avg !== "-" ? " / 5" : ""}</div>
            </div>

            <div class="perk-parent-summary">
              ${PERKEMBANGAN_ASPEK.map((a) => `
                <div class="perk-parent-aspect">
                  <div class="name">${a}</div>
                  <div class="score">${latest[a]?.nilai ? `${latest[a].nilai}/5` : "—"}</div>
                </div>
              `).join("")}
            </div>

            <div class="perk-note">
              <strong>Catatan pelatih</strong>
              <div style="margin-top:5px;">${note || "Belum ada catatan perkembangan untuk bulan ini."}</div>
              ${date ? `<div class="perk-date">${namaBulan(bulan)} ${tahun} · ${guru}</div>` : ""}
            </div>

            <div class="perk-history">
              <div class="perk-history-title">
                <div>
                  <h3 style="margin:0;">Penilaian sebelumnya</h3>
                  <div style="font-size:11px;color:var(--ink-soft);margin-top:3px;">
                    Pilih bulan dan tahun untuk melihat detail penilaian.
                  </div>
                </div>
                ${historySelect}
              </div>
              <div id="perkembanganRiwayatPanel">
                ${histPeriods.length ? "Memuat penilaian..." : "<div class='empty'>Belum ada riwayat penilaian sebelumnya.</div>"}
              </div>
            </div>
          `;

          if (defaultHistory) renderRiwayatPerkembanganDipilih(defaultHistory);
        } catch (e) {
          console.error(e);
          body.innerHTML = `<div class="empty" style="color:#E11D48;">Tabel perkembangan belum tersedia.</div>`;
        }
      }

      // ============================================================
      // VIEW: HALAMAN ORANG TUA
      // ============================================================

      // Satu akun orang tua bisa punya lebih dari satu anak (siswa.orang_tua_id
      // menunjuk ke pengguna.id). Daftar anak & anak yang sedang dipilih
      // disimpan di sini supaya bisa dipakai bersama oleh ketiga halaman.
      let anakOrangTuaList = [];
      let anakTerpilihId = null;

      async function pastikanAnakOrangTuaDimuat() {
        if (!supabase || !currentUser) return;
        if (anakOrangTuaList.length > 0) return;

        const { data, error } = await supabase
          .from("siswa")
          .select("id, nama, nis, kelas, tahun_ajaran")
          .eq("orang_tua_id", currentUser.id)
          .order("nama", { ascending: true });

        if (error) {
          console.error("Error load daftar anak:", error);
          return;
        }

        anakOrangTuaList = data || [];
        if (!anakTerpilihId && anakOrangTuaList.length > 0) {
          anakTerpilihId = anakOrangTuaList[0].id;
        }
      }

      function anakYangDipilih() {
        return anakOrangTuaList.find((a) => a.id === anakTerpilihId) || anakOrangTuaList[0] || null;
      }

      function renderPilihAnakHtml() {
        if (anakOrangTuaList.length <= 1) return "";
        const opsi = anakOrangTuaList
          .map((a) => `<option value="${a.id}" ${a.id === anakTerpilihId ? "selected" : ""}>${a.nama} — ${a.kelas || "-"}</option>`)
          .join("");
        return `
          <div class="controls" style="margin-bottom:16px;">
            <select id="pilihAnak" onchange="window.__app.gantiAnak(this.value)">${opsi}</select>
          </div>
        `;
      }

      function gantiAnak(id) {
        anakTerpilihId = id;
        renderView();
      }

      // ------------------------------------------------------
      // Ringkasan Anak
      // ------------------------------------------------------
      function renderRingkasanAnak() {
        return `
          <div id="pilihAnakWrap"></div>
          <div id="ringkasanAnakBody"><div class="empty">Memuat data anak...</div></div>
        `;
      }

      async function loadRingkasanAnak() {
        const wrap = document.getElementById("pilihAnakWrap");
        const body = document.getElementById("ringkasanAnakBody");
        if (!body || !supabase) return;

        await pastikanAnakOrangTuaDimuat();
        if (wrap) wrap.innerHTML = renderPilihAnakHtml();

        if (anakOrangTuaList.length === 0) {
          body.innerHTML = `<div class="empty">Belum ada data siswa yang terhubung dengan akun ini. Hubungi admin sekolah untuk menautkannya.</div>`;
          return;
        }

        const anak = anakYangDipilih();

        try {
          const today = new Date();
          const bulanIni = today.getMonth() + 1;
          const tahunIni = today.getFullYear();
          const bulanStr = String(bulanIni).padStart(2, "0");
          const hariTerakhir = new Date(tahunIni, bulanIni, 0).getDate();

          const { data: absensiBulanIni, error: absensiError } = await supabase
            .from("absensi")
            .select("status")
            .eq("siswa_id", anak.id)
            .gte("tanggal", `${tahunIni}-${bulanStr}-01`)
            .lte("tanggal", `${tahunIni}-${bulanStr}-${String(hariTerakhir).padStart(2, "0")}`);
          if (absensiError) throw absensiError;

          const hitung = { H: 0, I: 0, S: 0, A: 0 };
          (absensiBulanIni || []).forEach((a) => {
            if (hitung[a.status] !== undefined) hitung[a.status]++;
          });

          const { data: sppBulanIni, error: sppError } = await supabase
            .from("spp")
            .select("status, nominal")
            .eq("siswa_id", anak.id)
            .eq("bulan", bulanIni)
            .eq("tahun", tahunIni)
            .maybeSingle();
          if (sppError) throw sppError;

          body.innerHTML = `
            <div class="section">
              <div class="section-head"><h2>${anak.nama}</h2></div>
              <div class="section-body">
                <p style="margin:0 0 18px; color:var(--ink-soft);">
                  NIS: ${anak.nis || "-"} &middot; Kelas: ${anak.kelas || "-"} &middot; Tahun Ajaran: ${anak.tahun_ajaran || "-"}
                </p>

                <div class="stat-row">
                  <div class="stat c-teal"><div class="num">${hitung.H}</div><div class="lbl">Hadir — ${namaBulan(bulanIni)}</div></div>
                  <div class="stat c-warn"><div class="num">${hitung.I}</div><div class="lbl">Izin — ${namaBulan(bulanIni)}</div></div>
                  <div class="stat c-sick"><div class="num">${hitung.S}</div><div class="lbl">Sakit — ${namaBulan(bulanIni)}</div></div>
                  <div class="stat c-bad"><div class="num">${hitung.A}</div><div class="lbl">Alpa — ${namaBulan(bulanIni)}</div></div>
                </div>

                <div style="margin-top:20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                  <span class="badge ${sppBulanIni ? (sppBulanIni.status === "Lunas" ? "badge-good" : "badge-bad") : "badge-muted"}">
                    SPP ${namaBulan(bulanIni)} ${tahunIni}: ${sppBulanIni ? sppBulanIni.status : "Belum ada tagihan"}
                  </span>
                  ${sppBulanIni ? `<span style="color:var(--ink-soft); font-size:13px;">${formatRupiah(sppBulanIni.nominal)}</span>` : ""}
                </div>
              </div>
            </div>
          `;
        } catch (error) {
          console.error("Error load ringkasan anak:", error);
          body.innerHTML = `<div class="empty" style="color:#E11D48;">Gagal memuat ringkasan anak.</div>`;
        }
      }

      // ------------------------------------------------------
      // Kehadiran Anak
      // ------------------------------------------------------
      function renderAbsenAnak() {
        const today = new Date();
        const todayStr = today.toISOString().slice(0, 10);
        const awalBulanStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-01`;

        return `
          <div id="pilihAnakWrap"></div>
          <div class="section">
            <div class="section-head">
              <h2>Kehadiran Anak</h2>
              <div class="controls">
                <input type="date" id="absenAnakDari" value="${awalBulanStr}">
                <input type="date" id="absenAnakSampai" value="${todayStr}">
                <button class="btn secondary" onclick="window.__app.loadAbsenAnak()">Tampilkan</button>
              </div>
            </div>
            <div class="section-body">
              <table>
                <thead><tr><th>Tanggal</th><th>Status</th><th>Keterangan</th></tr></thead>
                <tbody id="daftarAbsenAnak">
                  <tr><td colspan="3" style="text-align:center;">Memuat data...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      async function loadAbsenAnak() {
        const wrap = document.getElementById("pilihAnakWrap");
        const tbody = document.getElementById("daftarAbsenAnak");
        if (!tbody || !supabase) return;

        await pastikanAnakOrangTuaDimuat();
        if (wrap) wrap.innerHTML = renderPilihAnakHtml();

        if (anakOrangTuaList.length === 0) {
          tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Belum ada data siswa yang terhubung dengan akun ini.</td></tr>`;
          return;
        }

        const anak = anakYangDipilih();
        const dari = document.getElementById("absenAnakDari")?.value;
        const sampai = document.getElementById("absenAnakSampai")?.value;

        if (!dari || !sampai) {
          tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Pilih rentang tanggal terlebih dahulu.</td></tr>`;
          return;
        }

        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Memuat data...</td></tr>`;

        try {
          const { data, error } = await supabase
            .from("absensi")
            .select("tanggal, status, keterangan")
            .eq("siswa_id", anak.id)
            .gte("tanggal", dari)
            .lte("tanggal", sampai)
            .order("tanggal", { ascending: false });
          if (error) throw error;

          if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Tidak ada data absensi pada rentang ini.</td></tr>`;
            return;
          }

          tbody.innerHTML = data
            .map(
              (a) => `
            <tr>
              <td>${a.tanggal || "-"}</td>
              <td><span class="badge ${statusBadgeAbsensi(a.status)}">${labelStatusAbsensi(a.status)}</span></td>
              <td>${a.keterangan || "-"}</td>
            </tr>
          `
            )
            .join("");
        } catch (error) {
          console.error("Error load absen anak:", error);
          tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#E11D48;">Gagal memuat data absensi.</td></tr>`;
        }
      }

      // ------------------------------------------------------
      // Status SPP (anak)
      // ------------------------------------------------------
      function renderSppAnak() {
        const tahunSekarang = new Date().getFullYear();
        const tahunOptions =
          `<option value="">Semua tahun</option>` +
          [tahunSekarang, tahunSekarang - 1, tahunSekarang - 2]
            .map((t) => `<option value="${t}" ${t === tahunSekarang ? "selected" : ""}>${t}</option>`)
            .join("");

        return `
          <div id="pilihAnakWrap"></div>
          <div class="section">
            <div class="section-head">
              <h2>Status SPP</h2>
              <div class="controls">
                <select id="sppAnakTahun">${tahunOptions}</select>
                <button class="btn secondary" onclick="window.__app.loadSppAnak()">Tampilkan</button>
              </div>
            </div>
            <div class="section-body">
              <table>
                <thead><tr><th>Bulan</th><th>Tahun</th><th class="num">Nominal</th><th>Status</th><th>Tanggal Bayar</th></tr></thead>
                <tbody id="daftarSppAnak">
                  <tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      async function loadSppAnak() {
        const wrap = document.getElementById("pilihAnakWrap");
        const tbody = document.getElementById("daftarSppAnak");
        if (!tbody || !supabase) return;

        await pastikanAnakOrangTuaDimuat();
        if (wrap) wrap.innerHTML = renderPilihAnakHtml();

        if (anakOrangTuaList.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Belum ada data siswa yang terhubung dengan akun ini.</td></tr>`;
          return;
        }

        const anak = anakYangDipilih();
        const tahun = document.getElementById("sppAnakTahun")?.value;

        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Memuat data...</td></tr>`;

        try {
          let query = supabase
            .from("spp")
            .select("bulan, tahun, nominal, status, tanggal_bayar")
            .eq("siswa_id", anak.id);
          if (tahun) query = query.eq("tahun", Number(tahun));

          const { data, error } = await query.order("tahun", { ascending: false }).order("bulan", { ascending: false });
          if (error) throw error;

          if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">Belum ada data SPP.</td></tr>`;
            return;
          }

          tbody.innerHTML = data
            .map(
              (s) => `
            <tr>
              <td>${namaBulan(s.bulan)}</td>
              <td>${s.tahun}</td>
              <td class="num">${formatRupiah(s.nominal)}</td>
              <td><span class="badge ${s.status === "Lunas" ? "badge-good" : "badge-bad"}">${s.status}</span></td>
              <td>${s.tanggal_bayar || "-"}</td>
            </tr>
          `
            )
            .join("");
        } catch (error) {
          console.error("Error load SPP anak:", error);
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#E11D48;">Gagal memuat data SPP.</td></tr>`;
        }
      }

      // ============================================================
      // UTILITIES
      // ============================================================
      // Kolom absensi.status di database hanya menerima kode huruf
      // (H/I/S/A), jadi semua penyimpanan/pembacaan pakai kode ini.
      // Untuk tampilan, kode dipetakan ke label Bahasa Indonesia di sini.
      const ABSEN_STATUS_LABELS = { H: "Hadir", I: "Izin", S: "Sakit", A: "Alpa" };

      function labelStatusAbsensi(kode) {
        return ABSEN_STATUS_LABELS[kode] || kode || "-";
      }

      function statusBadgeAbsensi(status) {
        const map = { H: "badge-good", I: "badge-warn", S: "badge-sick", A: "badge-bad" };
        return map[status] || "badge-muted";
      }

      function formatRupiah(angka) {
        const n = Number(angka) || 0;
        return "Rp " + n.toLocaleString("id-ID");
      }

      function namaBulan(bulanNum) {
        const nama = [
          "Januari", "Februari", "Maret", "April", "Mei", "Juni",
          "Juli", "Agustus", "September", "Oktober", "November", "Desember",
        ];
        return nama[(Number(bulanNum) || 1) - 1] || "-";
      }

      async function loadKelasOptions(selectId) {
        const select = document.getElementById(selectId);
        if (!select || !supabase) return;

        try {
          const { data, error } = await supabase.from("siswa").select("kelas");
          if (error) throw error;

          const kelasUnik = [...new Set((data || []).map((s) => s.kelas).filter(Boolean))].sort();
          select.innerHTML =
            `<option value="">Pilih kelas...</option>` +
            kelasUnik.map((k) => `<option value="${k}">${k}</option>`).join("");
        } catch (error) {
          console.error("Error load kelas:", error);
        }
      }

      function updateTodayChip() {
        const today = new Date();
        const options = { day: "numeric", month: "short", year: "numeric" };
        const formatted = today.toLocaleDateString("id-ID", options);
        document.getElementById("todayChip").textContent = formatted;
      }


      // ============================================================
      // UTILITAS: EXPORT & NOTIFIKASI
      // ============================================================
      function downloadCsv(filename, rows) {
        const csv = rows.map(row => row.map(v => { const x = String(v ?? "").replace(/"/g, '""'); return `"${x}"`; }).join(",")).join("\n");
        const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename; a.click();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      }

      async function exportSppCsv() {
        if (!supabase) return alert("Supabase belum terhubung.");
        const bulan = Number(document.getElementById("filterBulanSpp")?.value);
        const tahun = Number(document.getElementById("filterTahunSpp")?.value);
        const status = document.getElementById("filterStatusSpp")?.value;
        let query = supabase.from("spp").select("nominal,status,tanggal_bayar,siswa:siswa_id(nama,kelas,nis)").eq("bulan", bulan).eq("tahun", tahun).order("created_at", {ascending:false});
        if (status) query = query.eq("status", status);
        const {data,error}=await query; if(error) return alert("Gagal export SPP: " + error.message);
        const rows=[["Nama","NIS","Kelas","Nominal","Status","Tanggal Bayar"]];
        (data||[]).forEach(x=>rows.push([x.siswa?.nama||"",x.siswa?.nis||"",x.siswa?.kelas||"",x.nominal||0,x.status||"",x.tanggal_bayar||""]));
        downloadCsv(`gantariku-spp-${tahun}-${String(bulan).padStart(2,"0")}.csv`,rows);
      }

      async function exportAbsensiGuruCsv() {
        if (!supabase) return alert("Supabase belum terhubung.");
        const dari=document.getElementById("guruAbsenTanggalDari")?.value, sampai=document.getElementById("guruAbsenTanggalSampai")?.value, status=document.getElementById("guruAbsenStatus")?.value;
        let query=supabase.from("absensi_guru").select("tanggal,status,keterangan,guru:guru_id(nama,email)").gte("tanggal",dari).lte("tanggal",sampai).order("tanggal",{ascending:false});
        if(status) query=query.eq("status",status);
        const {data,error}=await query; if(error) return alert("Gagal export absensi guru: "+error.message);
        const rows=[["Tanggal","Guru/Pelatih","Email","Status","Keterangan"]];
        (data||[]).forEach(x=>rows.push([x.tanggal||"",x.guru?.nama||"",x.guru?.email||"",x.status||"",x.keterangan||""]));
        downloadCsv(`gantariku-absensi-guru-${dari}-${sampai}.csv`,rows);
      }

      async function exportRekapAbsensiCsv() {
        if (!supabase) return alert("Supabase belum terhubung.");
        const dari=document.getElementById("rekapDari")?.value, sampai=document.getElementById("rekapSampai")?.value, kelas=document.getElementById("rekapKelas")?.value;
        const {data,error}=await supabase.from("absensi").select("tanggal,status,keterangan,siswa:siswa_id(nama,nis,kelas)").gte("tanggal",dari).lte("tanggal",sampai).order("tanggal",{ascending:false});
        if(error) return alert("Gagal export rekap absensi: "+error.message);
        const hasil=(data||[]).filter(x=>!kelas || x.siswa?.kelas===kelas);
        const rows=[["Tanggal","Nama","NIS","Kelas","Status","Keterangan"]];
        hasil.forEach(x=>rows.push([x.tanggal||"",x.siswa?.nama||"",x.siswa?.nis||"",x.siswa?.kelas||"",x.status||"",x.keterangan||""]));
        downloadCsv(`gantariku-rekap-absensi-${dari}-${sampai}.csv`,rows);
      }

      function toggleNotifikasi(){
        const p=document.getElementById("notifPanel"); if(!p)return; p.classList.toggle("show"); if(p.classList.contains("show")) loadNotifikasi();
      }

      async function loadNotifikasi(){
        const p=document.getElementById("notifPanel"), c=document.getElementById("notifCount"); if(!p||!supabase||currentUserRole!=="admin") return;
        const items=[];
        try{
          const now=new Date(), b=now.getMonth()+1, t=now.getFullYear(), ds=now.toISOString().slice(0,10);
          const {data:spp}=await supabase.from("spp").select("id").eq("bulan",b).eq("tahun",t).neq("status","Lunas");
          if((spp||[]).length) items.push(`💳 ${spp.length} tagihan SPP bulan ${namaBulan(b)} belum lunas.`);
          const {data:ag}=await supabase.from("absensi_guru").select("guru_id").eq("tanggal",ds);
          const {count:gc}=await supabase.from("pengguna").select("id",{count:"exact",head:true}).eq("role","guru");
          const recorded=new Set((ag||[]).map(x=>x.guru_id));
          if(gc && recorded.size<gc) items.push(`👩‍🏫 ${gc-recorded.size} guru/pelatih belum mengisi absensi hari ini.`);
          const {data:a}=await supabase.from("absensi").select("siswa_id").eq("tanggal",ds);
          const {count:sc}=await supabase.from("siswa").select("id",{count:"exact",head:true});
          if(sc && (a||[]).length<sc) items.push(`📋 Masih ada siswa yang belum memiliki absensi hari ini.`);
        }catch(e){console.error(e)}
        c.textContent=items.length; c.style.display=items.length?"inline-block":"none";
        p.innerHTML=items.length?`<div style="font-weight:700;margin-bottom:6px;">Perlu Perhatian</div>${items.map(x=>`<div class="notif-item">${x}</div>`).join("")}`:`<div style="font-weight:700;">Semua aman ✨</div><div class="notif-item">Belum ada hal yang perlu ditindaklanjuti.</div>`;
      }

      function getRoleLabel(role) {
        const map = { admin: "Admin Sekolah", guru: "Guru", ortu: "Orang Tua" };
        return map[role] || role;
      }

      // ============================================================
      // INITIALIZATION
      // ============================================================
      async function init() {
        try {
          if (!supabase) {
            renderLogin();
            return;
          }

          const { data: { session }, error: sessionError } = await supabase.auth.getSession();
          if (sessionError) throw sessionError;

          if (!session) {
            renderLogin();
            return;
          }

          const { data: { user }, error: userError } = await supabase.auth.getUser();
          if (userError || !user) {
            await supabase.auth.signOut();
            renderLogin();
            return;
          }

          const profile = await loadUserProfile(user.id);

          currentUser = profile;
          currentUserRole = profile.role;
          currentNav = NAV_CONFIG[currentUserRole]?.[0]?.id || "dasbor";

          renderApp();
        } catch (error) {
          console.error("Init error:", error);
          if (supabase) await supabase.auth.signOut();
          currentUser = null;
          currentUserRole = null;
          renderLogin();
        }
      }

      // Expose app functions to window
      window.__app = {
        goTo,
        logout,
        toggleMobileMenu,
        bukaFormSiswa,
        tutupFormSiswa,
        hapusSiswa,
        bukaFormSpp,
        tutupFormSpp,
        tandaiLunas,
        hapusSpp,
        loadGuru,
        loadAbsensiGuruAdmin,
        loadAbsensiSaya,
        simpanAbsensiSaya,
        exportSppCsv,
        buatTagihanBulanan,
        loadPerhatian,
        exportAbsensiGuruCsv,
        exportRekapAbsensiCsv,
        exportPerkembanganCsv,
        loadPerkembanganAdmin,
        changePerkPage,
        loadSiswaPerkembangan,
        simpanPerkembangan,
        loadPerkembanganGuru,
        loadPerkembanganAnak,
        toggleNotifikasi,
        loadFormInputAbsen,
        simpanAbsensiMassal,
        loadRekapAbsensi,
        loadRiwayatAbsensi,
        gantiAnak,
        loadAbsenAnak,
        loadSppAnak,
        tampilkanRiwayatPerkembangan: renderRiwayatPerkembanganDipilih,
      };

      // Start app
      init();
    </script>
