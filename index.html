    <style>

      :root {

        --ink: #211B3B;
        --ink-soft: #6E6690;

      * {

      body {

      /* ========== LOGIN PAGE ========== */
      .login-container {

        background: linear-gradient(135deg, #4E31D6 0%, #6C4CF1 50%, #8B5CF6 100%);
      }

      .login-box {
        margin: auto;
        background: var(--surface);
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(33, 27, 59, .3);
      }

      .login-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 30px;
      }

      .login-logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: linear-gradient(135deg, #4E31D6, #6C4CF1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        color: white;
      }

      .login-brand {
        text-align: left;
      }

      .login-brand h1 {
        font-size: 24px;
        font-weight: 700;
        margin: 0;
        color: var(--ink);
      }

      .login-brand p {
        font-size: 12px;
        color: var(--ink-soft);
        margin: 4px 0 0;
      }

      .login-form {
        display: flex;
        flex-direction: column;

      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-group label {

        font-weight: 600;
        color: var(--ink);

      .form-group input,
      .form-group select {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        color: var(--ink);
        background: #fff;
        transition: border-color .2s, box-shadow .2s;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(108, 76, 241, .1);
      }

      .login-btn {
        padding: 10px 16px;
        background: linear-gradient(135deg, #4E31D6, #6C4CF1);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: transform .1s, box-shadow .2s;

      .login-btn:hover {
        box-shadow: 0 10px 30px rgba(108, 76, 241, .3);
      }

      .login-btn:active {
        transform: scale(.95);
      }

        opacity: .6;

        padding: 10px 12px;
        background: var(--bad-soft);
        color: var(--bad);

      .loading-spinner {

    <script type="module">
      // ============================================================
      // SUPABASE CONFIGURATION
      // ============================================================
      const SUPABASE_URL = "https://uwrbirojmuudshhrrcgt.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_SP0aUTX9jn9p1Kzv74S_Fg_eT4Hrs5E";

      const isConfigured =
        /^https:\/\/.+\.supabase\.co$/.test(SUPABASE_URL) &&
        SUPABASE_ANON_KEY &&
        !SUPABASE_ANON_KEY.includes("PASTE_YOUR");

      let supabase = null;

      if (isConfigured) {
        const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      // ============================================================
      // GLOBAL STATE
      // ============================================================
      let currentUser = null;
let currentUserRole = null;

// ============================================================
// LOAD USER PROFILE
// ============================================================
async function loadUserProfile(userId) {
  if (!supabase) {
    throw new Error("Supabase belum dikonfigurasi");
  }

  const { data, error } = await supabase
    .from("pengguna")
    .select("id, user_id, nama, email, role")
    .eq("user_id", userId)
    .single();

  if (error) {
    console.error("Profile error:", error);
    throw new Error("Profil pengguna tidak ditemukan atau tidak dapat diakses.");
  }

  if (!data) {
    throw new Error("Profil pengguna tidak ditemukan.");
  }

  return data;
}

        return `

                  <h1>Gantariku</h1>
                  <p>Absensi &amp; SPP</p>
                </div>
              </div>

              <div class="error-msg" id="loginError"></div>

              <form class="login-form" id="loginForm">
                
                <div class="form-group">
                  <label for="email">Email</label>
                  <input type="email" id="email" placeholder="nama@sekolah.id" required>
                </div>

                <div class="form-group">
                  <label for="password">Password</label>
                  <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                  <span id="loginBtnText">Masuk</span>
                </button>
              </form>
            </div>
          </div>
        `;

      // ============================================================
      // LOGIN HANDLER
      // ============================================================
     async function handleLogin(e) {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const errorEl = document.getElementById("loginError");
  const btnEl = document.getElementById("loginBtn");
  const btnText = document.getElementById("loginBtnText");

  errorEl.textContent = "";
  errorEl.classList.remove("show");

  if (!email || !password) {
    errorEl.textContent = "Email dan password harus diisi.";
    errorEl.classList.add("show");
    return;
  }

  btnEl.disabled = true;
  btnText.innerHTML =
    '<span class="loading-spinner"></span>Memproses...';

  try {
    if (!supabase) {
      throw new Error("Supabase belum dikonfigurasi.");
    }

    // ========================================================
    // STEP 1 - LOGIN KE SUPABASE AUTH
    // ========================================================

    const {
      data: authData,
      error: authError
    } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (authError) {
      throw new Error("Email atau password salah.");
    }

    if (!authData.user) {
      throw new Error("User tidak ditemukan.");
    }

    // ========================================================
    // STEP 2 - AMBIL PROFIL & ROLE DARI DATABASE
    // ========================================================

    const profile = await loadUserProfile(authData.user.id);

    // ========================================================
    // STEP 3 - SIMPAN DI MEMORY APLIKASI
    // ========================================================

    currentUser = profile;
    currentUserRole = profile.role;

    // ========================================================
    // STEP 4 - TAMPILKAN APLIKASI
    // ========================================================

    currentNav =
      NAV_CONFIG[currentUserRole]?.[0]?.id || "dasbor";

    renderApp();

  } catch (error) {

    console.error("Login error:", error);

    // Jika Auth berhasil tetapi profil gagal,
    // bersihkan session agar tidak terjadi login setengah.
    if (supabase) {
      await supabase.auth.signOut();
    }

    errorEl.textContent =
      error.message || "Terjadi kesalahan saat login.";

    errorEl.classList.add("show");

  } finally {

    btnEl.disabled = false;
    btnText.textContent = "Masuk";

  }
}

        admin: [
          { id: "dasbor", label: "Dasbor", icon: "📊" },
          { id: "siswa", label: "Data Siswa", icon: "👥" },
          { id: "spp", label: "Monitoring SPP", icon: "💰" },
          { id: "rekap", label: "Rekap Absensi", icon: "📋" },
        ],
        guru: [
          { id: "input-absen", label: "Input Absensi", icon: "✓" },
          { id: "riwayat-absen", label: "Riwayat Absensi", icon: "📅" },
        ],

            (item) =>
              `<button class="nav-item ${currentNav === item.id ? "active" : ""}" 
                       onclick="window.__app.goTo('${item.id}')">
                <span>${item.icon}</span>

          )
          .join("");
      }

      function goTo(navId) {

        renderNav();
        renderView();

          default:

        viewEl.innerHTML = html;

titleEl.textContent = title;

subEl.textContent = subtitle;


// ============================================================
// KHUSUS HALAMAN SISWA
// ============================================================

if (currentNav === "siswa") {

  loadSiswa();

  if (formSiswa) {

      // ============================================================

function bukaFormSiswa() {

  const formContainer =
    document.getElementById("formSiswaContainer");

  if (formContainer) {

    formContainer.style.display = "block";

  }

}


function tutupFormSiswa() {

  const formContainer =
    document.getElementById("formSiswaContainer");

  const form =
    document.getElementById("formSiswa");

  if (formContainer) {

    formContainer.style.display = "none";

  }

  if (form) {

    form.reset();

  }

}
      async function simpanSiswa(event) {

  event.preventDefault();


  if (!supabase) {

    alert(
      "Supabase belum terhubung."
    );

    return;

  }


  const btn =
    document.getElementById("btnSimpanSiswa");


  const nama =
    document.getElementById("siswaNama").value.trim();


  const nis =
    document.getElementById("siswaNis").value.trim();


  const kelas =
    document.getElementById("siswaKelas").value.trim();


  const tahunAjaran =
    document.getElementById("siswaTahunAjaran").value.trim();


  const tanggalLahir =
    document.getElementById("siswaTanggalLahir").value;


  const jenisKelamin =
    document.getElementById("siswaJenisKelamin").value;


  const nomorHpOrtu =
    document.getElementById("siswaNomorHpOrtu").value.trim();


  const alamat =
    document.getElementById("siswaAlamat").value.trim();


  if (!nama || !nis || !kelas) {

    alert(
      "Nama, NIS, dan Kelas wajib diisi."
    );

    return;

  }


  btn.disabled = true;

  btn.textContent =
    "Menyimpan...";


  try {

    const dataSiswa = {

      nama: nama,

      nis: nis,

      kelas: kelas,

      tahun_ajaran:
        tahunAjaran || null,

      tanggal_lahir:
        tanggalLahir || null,

      jenis_kelamin:
        jenisKelamin || null,

      nomor_hp_ortu:
        nomorHpOrtu || null,

      alamat:
        alamat || null

    };


    const {
      data,
      error
    } = await supabase

      .from("siswa")

      .insert(dataSiswa)

      .select();


    if (error) {

      throw error;

    }


    alert(
      "Siswa berhasil ditambahkan!"
    );


    tutupFormSiswa();


    await loadSiswa();


  } catch (error) {

    console.error(
      "Error tambah siswa:",
      error
    );


    alert(
      "Gagal menyimpan siswa:\n\n" +
      error.message
    );

  } finally {

    btn.disabled = false;

    btn.textContent =
      "Simpan Siswa";

  }

}
      async function loadSiswa() {

  const tbody =
    document.getElementById("daftarSiswa");


  if (!tbody) {

    return;

  }


  tbody.innerHTML = `
    <tr>

      <td
        colspan="5"
        style="text-align:center;"
      >
        Memuat data siswa...
      </td>

    </tr>
  `;


  try {

    if (!supabase) {

      throw new Error(
        "Supabase belum terhubung."
      );

    }


    const {
      data,
      error
    } = await supabase

      .from("siswa")

      .select(`
        id,
        nama,
        nis,
        kelas,
        tahun_ajaran,
        nomor_hp_ortu
      `)

      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {

      throw error;

    }


    if (!data || data.length === 0) {

      tbody.innerHTML = `
        <tr>

          <td
            colspan="5"
            style="text-align:center;"
          >
            Belum ada data siswa.
          </td>

        </tr>
      `;

      return;

    }


    tbody.innerHTML =
      data.map(
        siswa => `

          <tr>

            <td>
              ${siswa.nama || "-"}
            </td>


            <td>
              ${siswa.nis || "-"}
            </td>


            <td>
              ${siswa.kelas || "-"}
            </td>


            <td>
              ${siswa.tahun_ajaran || "-"}
            </td>


            <td>
              ${siswa.nomor_hp_ortu || "-"}
            </td>

          </tr>

        `
      ).join("");


  } catch (error) {

    console.error(
      "Error load siswa:",
      error
    );


    tbody.innerHTML = `
      <tr>

        <td
          colspan="5"
          style="
            text-align:center;
            color:#E11D48;
          "
        >

          Gagal memuat data siswa.

        </td>

      </tr>
    `;

  }

}

      async function logout() {

  try {

    if (supabase) {
      const { error } = await supabase.auth.signOut();

      if (error) {
        console.error("Logout error:", error);
      }
    }

  } catch (error) {

    console.error("Logout error:", error);

  } finally {

    currentUser = null;
    currentUserRole = null;
    currentNav = "dasbor";

    renderLogin();

  }
}

      // ============================================================
      // INITIALIZATION
      // ============================================================
      async function init() {

  try {

    if (!supabase) {
      renderLogin();
      return;
    }

    // ========================================================
    // CEK SESSION SUPABASE
    // ========================================================

    const {
      data: { session },
      error: sessionError
    } = await supabase.auth.getSession();

    if (sessionError) {
      throw sessionError;
    }

    // Tidak ada session
    if (!session) {
      renderLogin();
      return;
    }

    // ========================================================
    // VALIDASI USER AKTIF
    // ========================================================

    const {
      data: { user },
      error: userError
    } = await supabase.auth.getUser();

    if (userError || !user) {

      await supabase.auth.signOut();

      renderLogin();

      return;
    }

    // ========================================================
    // AMBIL PROFIL TERBARU DARI DATABASE
    // ========================================================

    const profile = await loadUserProfile(user.id);

    currentUser = profile;
    currentUserRole = profile.role;

    // Tentukan menu awal berdasarkan role
    currentNav =
      NAV_CONFIG[currentUserRole]?.[0]?.id || "dasbor";

    renderApp();

  } catch (error) {

    console.error("Init error:", error);

    // Jika session bermasalah,
    // paksa kembali ke login
    if (supabase) {
      await supabase.auth.signOut();
    }

    currentUser = null;
    currentUserRole = null;

    renderLogin();
  }
}
