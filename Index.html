<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <title>Sekolahku — Absensi &amp; SPP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

      :root {
        --bg: #F4F2FC;
        --surface: #FFFFFF;
        --ink: #211B3B;
        --ink-soft: #6E6690;
        --line: #E7E2F7;
        --primary: #6C4CF1;
        --primary-dark: #4E31D6;
        --primary-soft: #EDE7FD;
        --teal: #0EA5A0;
        --pink: #EC4899;
        --good: #16A34A;
        --good-soft: #DCF7E5;
        --warn: #D97706;
        --warn-soft: #FDECD1;
        --sick: #7C3AED;
        --sick-soft: #EEE5FD;
        --bad: #E11D48;
        --bad-soft: #FCE1E8;
        --muted: #F1EEFA;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2 {
        font-family: 'Space Grotesk', sans-serif;
      }

      .app {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 246px;
        flex-shrink: 0;
        background: linear-gradient(180deg, #4E31D6 0%, #6C4CF1 55%, #8B5CF6 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        padding: 24px 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: rgba(255, 255, 255, .18);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }

      .brand-text {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 16px;
        line-height: 1.1;
      }

      .brand-sub {
        font-size: 11px;
        color: rgba(255, 255, 255, .7);
      }

      .role-card {
        background: rgba(255, 255, 255, .12);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 22px;
      }

      .role-label {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: .04em;
        color: rgba(255, 255, 255, .6);
        padding: 4px 6px 8px;
      }

      .role-options {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .role-btn {
        all: unset;
        cursor: pointer;
        padding: 8px 10px;
        border-radius: 7px;
        font-size: 13px;
        color: rgba(255, 255, 255, .85);
        font-weight: 500;
        transition: background .15s;
      }

      .role-btn:hover {
        background: rgba(255, 255, 255, .12);
      }

      .role-btn.active {
        background: #fff;
        color: var(--primary-dark);
        font-weight: 700;
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .nav-item {
        all: unset;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 11px;
        border-radius: 8px;
        font-size: 13.5px;
        color: rgba(255, 255, 255, .8);
      }

      .nav-item svg {
        flex-shrink: 0;
        opacity: .85;
      }

      .nav-item:hover {
        background: rgba(255, 255, 255, .1);
      }

      .nav-item.active {
        background: rgba(255, 255, 255, .95);
        color: var(--primary-dark);
        font-weight: 600;
      }

      .nav-item.active svg {
        opacity: 1;
      }

      .sidebar-foot {
        margin-top: auto;
        padding-top: 14px;
        font-size: 11px;
        color: rgba(255, 255, 255, .7);
        line-height: 1.6;
      }

      .conn-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 6px;
        background: #FBBF24;
      }

      .conn-dot.ok {
        background: #34D399;
      }

      .conn-dot.err {
        background: #F87171;
      }

      .content {
        flex: 1;
        min-width: 0;
      }

      .topbar {
        padding: 26px 34px 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        flex-wrap: wrap;
      }

      .topbar h1 {
        font-size: 23px;
        font-weight: 700;
        margin: 0 0 4px;
      }

      .topbar p {
        margin: 0;
        color: var(--ink-soft);
        font-size: 13px;
      }

      .today-chip {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 7px 14px;
        font-size: 12.5px;
        color: var(--ink-soft);
        font-weight: 500;
        white-space: nowrap;
      }

      .view {
        padding: 6px 34px 50px;
        max-width: 1160px;
      }

      .stat-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 22px;
      }

      .stat {
        background: var(--surface);
        border-radius: 14px;
        padding: 16px 18px;
        border-left: 4px solid var(--primary);
        box-shadow: 0 1px 2px rgba(33, 27, 59, .05);
      }

      .stat.c-teal {
        border-left-color: var(--teal);
      }

      .stat.c-good {
        border-left-color: var(--good);
      }

      .stat.c-bad {
        border-left-color: var(--bad);
      }

      .stat.c-pink {
        border-left-color: var(--pink);
      }

      .stat .num {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 25px;
        font-weight: 700;
        line-height: 1.1;
      }

      .stat .lbl {
        font-size: 12px;
        color: var(--ink-soft);
        margin-top: 5px;
      }

      .section {
        background: var(--surface);
        border-radius: 16px;
        margin-bottom: 20px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(33, 27, 59, .05);
      }

      .section-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .section-head h2 {
        font-size: 16px;
        font-weight: 700;
        margin: 0;
      }

      .section-body {
        padding: 18px 20px;
      }

      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      input[type=text],
      select {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
      }

      input[type=text]:focus,
      select:focus {
        outline: 2px solid var(--primary);
        outline-offset: 1px;
        background: #fff;
      }

      input[type=text] {
        min-width: 190px;
      }

      .btn {
        all: unset;
        cursor: pointer;
        padding: 8px 15px;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        font-size: 12.5px;
        transition: background .15s, transform .1s;
      }

      .btn:hover {
        background: var(--primary-dark);
      }

      .btn:active {
        transform: scale(.97);
      }

      .btn:disabled {
        opacity: .5;
        cursor: not-allowed;
      }

      .btn.secondary {
        background: var(--primary-soft);
        color: var(--primary-dark);
      }

      .btn.secondary:hover {
        background: #DED3FB;
      }

      .btn.ghost {
        background: transparent;
        color: var(--ink-soft);
        border: 1px solid var(--line);
      }

      .btn.ghost:hover {
        background: var(--muted);
      }

      .btn.small {
        padding: 6px 11px;
        font-size: 11.5px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .03em;
        color: var(--ink-soft);
        font-weight: 600;
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
      }

      td {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        font-size: 13.5px;
      }

      tbody tr:hover {
        background: var(--bg);
      }

      tr:last-child td {
        border-bottom: none;
      }

      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 600;
      }

      .badge-good {
        background: var(--good-soft);
        color: var(--good);
      }

      .badge-warn {
        background: var(--warn-soft);
        color: var(--warn);
      }

      .badge-sick {
        background: var(--sick-soft);
        color: var(--sick);
      }

      .badge-bad {
        background: var(--bad-soft);
        color: var(--bad);
      }

      .badge-muted {
        background: var(--muted);
        color: var(--ink-soft);
      }

      .empty {
        padding: 34px;
        text-align: center;
        color: var(--ink-soft);
        font-size: 13px;
      }

      .att-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .att-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
      }

      .att-name {
        font-weight: 600;
      }

      .att-choices {
        display: flex;
        gap: 6px;
      }

      .chip {
        all: unset;
        cursor: pointer;
        padding: 6px 13px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid var(--line);
        color: var(--ink-soft);
        background: #fff;
        transition: transform .1s;
      }

      .chip:active {
        transform: scale(.95);
      }

      .chip.sel-H {
        background: var(--good);
        color: #fff;
        border-color: var(--good);
      }

      .chip.sel-I {
        background: var(--warn);
        color: #fff;
        border-color: var(--warn);
      }

      .chip.sel-S {
        background: var(--sick);
        color: #fff;
        border-color: var(--sick);
      }

      .chip.sel-A {
        background: var(--bad);
        color: #fff;
        border-color: var(--bad);
      }

      .hint {
        font-size: 12px;
        color: var(--ink-soft);
        margin-top: 8px;
      }

      .inline-form {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 14px;
        padding: 12px;
        background: var(--bg);
        border-radius: 10px;
      }

      .icon-btn {
        all: unset;
        cursor: pointer;
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        color: var(--ink-soft);
      }

      .icon-btn:hover {
        background: var(--bad-soft);
        color: var(--bad);
      }

      .setup-wrap {
        max-width: 640px;
        margin: 40px auto;
        padding: 28px;
        background: var(--surface);
        border-radius: 16px;
        box-shadow: 0 1px 2px rgba(33, 27, 59, .05);
      }

      .setup-wrap h2 {
        margin-top: 0;
      }

      .setup-wrap ol {
        padding-left: 20px;
        line-height: 1.9;
      }

      .setup-wrap code {
        background: var(--muted);
        padding: 2px 6px;
        border-radius: 5px;
        font-size: 12.5px;
      }

      .setup-wrap pre {
        background: #211B3B;
        color: #E7E2F7;
        padding: 14px 16px;
        border-radius: 10px;
        font-size: 12px;
        overflow-x: auto;
      }

      @media (max-width: 900px) {
        .stat-row {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 760px) {
        .app {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
          gap: 10px;
          padding: 14px 16px;
        }

        .role-card,
        .nav,
        .sidebar-foot {
          display: none;
        }

        .view,
        .topbar {
          padding-left: 18px;
          padding-right: 18px;
        }

        .stat-row {
          grid-template-columns: 1fr 1fr;
        }

        .setup-wrap {
          margin: 20px 16px;
          padding: 20px;
        }
      }
    </style>
  </head>

      </main>

gl)=>{ const batch = writeBatch(db); SISWA.filter(s=>s.kelas===kelas).forEach(s=>batch.set(doc(db,'absensi',`${s.id}_${tgl}`), {siswaId:String(s.id), tanggal:tgl, status:'H'})); await batch.commit(); }, setOrtuSiswa:(v)=>{ state.ortuSiswaId=v; render(); }, }; window.__app = actions;

      // =========================================================
      // SUPABASE DATA
      // =========================================================

      async function sb(promise) {
        const { data, error } = await promise;
        if (error) throw error;
        return data;
      }

      async function loadAllData() {
        const [siswaRows, absenRows, sppRows] = await Promise.all([
          sb(supabase.from('siswa').select('*').order('created_at', { ascending: true })),
          sb(supabase.from('absensi').select('*')),
          sb(supabase.from('spp').select('*'))
        ]);

        SISWA = siswaRows.map(row => ({
          id: String(row.id),
          nama: row.nama,
          kelas: row.kelas,
          ortu: row.ortu
        }));

        ABSEN = {};
        absenRows.forEach(row => {
          ABSEN[`${row.siswa_id}_${row.tanggal}`] = row.status;
        });

        SPP = {};
        sppRows.forEach(row => {
          SPP[`${row.siswa_id}_${row.bulan}`] = {
            status: row.status,
            tanggal: row.tanggal,
            nominal: Number(row.nominal || SPP_NOMINAL)
          };
        });

        render();
      }

      async function refreshData() {
        try {
          await loadAllData();
          setConn('ok', 'Terhubung — data real-time');
        } catch (error) {
          console.error(error);
          setConn('err', 'Gagal memuat data');
        }
      }

      function subscribeRealtime() {
        supabase
          .channel('sekolahku-realtime')
          .on('postgres_changes',
            { event: '*', schema: 'public', table: 'siswa' },
            refreshData)
          .on('postgres_changes',
            { event: '*', schema: 'public', table: 'absensi' },
            refreshData)
          .on('postgres_changes',
            { event: '*', schema: 'public', table: 'spp' },
            refreshData)
          .subscribe(status => {
            if (status === 'SUBSCRIBED') {
              setConn('ok', 'Terhubung — data real-time');
            }
          });
      }

      async function seedDatabase() {
        const initial = [
          {id:'1',nama:'Ahmad Fauzi',kelas:'7A',ortu:'Bapak Slamet'},
          {id:'2',nama:'Siti Aisyah',kelas:'7A',ortu:'Ibu Ratna'},
          {id:'3',nama:'Budi Santoso',kelas:'7A',ortu:'Bapak Hendra'},
          {id:'4',nama:'Dewi Lestari',kelas:'7A',ortu:'Ibu Sari'},
          {id:'5',nama:'Rizky Pratama',kelas:'7A',ortu:'Bapak Agus'},
          {id:'6',nama:'Nurul Hidayah',kelas:'8A',ortu:'Ibu Wati'},
          {id:'7',nama:'Fajar Nugroho',kelas:'8A',ortu:'Bapak Joko'},
          {id:'8',nama:'Putri Amelia',kelas:'8A',ortu:'Ibu Yuni'},
          {id:'9',nama:'Andi Setiawan',kelas:'8A',ortu:'Bapak Wawan'},
          {id:'10',nama:'Kartika Sari',kelas:'8A',ortu:'Ibu Ningsih'}
        ];

        await sb(supabase.from('siswa').upsert(
          initial.map(({id,nama,kelas,ortu}) => ({id,nama,kelas,ortu})),
          { onConflict: 'id' }
        ));

        const absenSeed = [];
        const sppSeed = [];

        initial.forEach(s => {
          TANGGAL_LIST.forEach((dk, idx) => {
            const r = seededRand(Number(s.id)*97 + idx*13);
            const status = r > 0.93 ? 'A' : r > 0.86 ? 'S' : r > 0.80 ? 'I' : 'H';
            absenSeed.push({ siswa_id:s.id, tanggal:dk, status });
          });

          for(let m=0; m<=BULAN_INI_INDEX; m++){
            const r = seededRand(Number(s.id)*31 + m*7 + 3);
            if(r > 0.24){
              const day = 1 + Math.floor(seededRand(Number(s.id)+m)*10);
              sppSeed.push({
                siswa_id:s.id, bulan:m, status:'lunas',
                tanggal:`${String(day).padStart(2,'0')} ${BULAN_NAMA[m].slice(0,3)} ${TODAY.getFullYear()}`,
                nominal:SPP_NOMINAL
              });
            } else {
              sppSeed.push({
                siswa_id:s.id, bulan:m, status:'belum',
                tanggal:null, nominal:SPP_NOMINAL
              });
            }
          }
        });

        await sb(supabase.from('absensi').upsert(
          absenSeed, { onConflict:'siswa_id,tanggal' }
        ));

        await sb(supabase.from('spp').upsert(
          sppSeed, { onConflict:'siswa_id,bulan' }
        ));
      }

      // =========================================================
      // UI ACTIONS
      // =========================================================

      const actions = {
        setRole,
        setNav,

        setSiswaCari: v => { state.siswaCari=v; render(); },
        toggleAddSiswa: () => { state.showAddSiswa=!state.showAddSiswa; render(); },

        addSiswa: async () => {
          const nama=document.getElementById('fNama').value.trim();
          const kelas=document.getElementById('fKelas').value;
          const ortu=document.getElementById('fOrtu').value.trim();

          if(!nama || !ortu){
            alert('Isi nama siswa dan nama orang tua/wali terlebih dahulu.');
            return;
          }

          try{
            await sb(supabase.from('siswa').insert({
              id:crypto.randomUUID(), nama, kelas, ortu
            }));
            state.showAddSiswa=false;
            state.siswaCari='';
            await refreshData();
          }catch(error){
            console.error(error);
            alert('Gagal menyimpan siswa: ' + error.message);
          }
        },

        deleteSiswa: async id => {
          if(!confirm('Hapus siswa ini beserta data absensi dan SPP terkait?')) return;
          try{
            await sb(supabase.from('siswa').delete().eq('id', String(id)));
            await refreshData();
          }catch(error){
            console.error(error);
            alert('Gagal menghapus siswa: ' + error.message);
          }
        },

        setSppCari: v => { state.sppCari=v; render(); },
        setSppFilter: v => { state.sppFilter=v; render(); },
        setSppBulan: v => { state.sppBulan=Number(v); render(); },

        toggleSpp: async (id,m,newStatus) => {
          try{
            const data = newStatus==='lunas'
              ? { siswa_id:String(id), bulan:Number(m), status:'lunas', tanggal:fmtTgl(TODAY), nominal:SPP_NOMINAL }
              : { siswa_id:String(id), bulan:Number(m), status:'belum', tanggal:null, nominal:SPP_NOMINAL };

            await sb(supabase.from('spp').upsert(data,{
              onConflict:'siswa_id,bulan'
            }));
            await refreshData();
          }catch(error){
            console.error(error);
            alert('Gagal memperbarui SPP: ' + error.message);
          }
        },

        tandaiSemuaLunas: async (ids,m) => {
          try{
            const rows=ids.map(id=>({
              siswa_id:String(id), bulan:Number(m), status:'lunas',
              tanggal:fmtTgl(TODAY), nominal:SPP_NOMINAL
            }));
            if(rows.length){
              await sb(supabase.from('spp').upsert(rows,{
                onConflict:'siswa_id,bulan'
              }));
            }
            await refreshData();
          }catch(error){
            console.error(error);
            alert('Gagal memperbarui SPP: ' + error.message);
          }
        },

        setRekapKelas: v => { state.rekapKelas=v; render(); },
        setRekapBulan: v => { state.rekapBulan=Number(v); render(); },
        setGuruKelas: v => { state.guruKelas=v; render(); },
        setGuruTanggal: v => { state.guruTanggal=v; render(); },

        setAbsen: async (id,tgl,code) => {
          try{
            await sb(supabase.from('absensi').upsert({
              siswa_id:String(id), tanggal:tgl, status:code
            },{ onConflict:'siswa_id,tanggal' }));
            await refreshData();
          }catch(error){
            console.error(error);
            alert('Gagal menyimpan absensi: ' + error.message);
          }
        },

        tandaiSemuaHadir: async (kelas,tgl) => {
          try{
            const rows=SISWA.filter(s=>s.kelas===kelas).map(s=>({
              siswa_id:String(s.id), tanggal:tgl, status:'H'
            }));
            if(rows.length){
              await sb(supabase.from('absensi').upsert(rows,{
                onConflict:'siswa_id,tanggal'
              }));
            }
            await refreshData();
          }catch(error){
            console.error(error);
            alert('Gagal menyimpan absensi: ' + error.message);
          }
        },

        setOrtuSiswa: v => { state.ortuSiswaId=v; render(); }
      };

      window.__app = actions;

      function renderSetupNotice(){
        document.querySelector('.sidebar').style.display='none';
        document.getElementById('pageTitle').textContent='Setup Supabase diperlukan';
        document.getElementById('pageSub').textContent='Sambungkan aplikasi ke Supabase untuk mengaktifkan database';

        document.getElementById('view').innerHTML=`
          <div class="setup-wrap">
            <h2>Supabase belum dikonfigurasi</h2>
            <p>Isi <code>SUPABASE_URL</code> dan <code>SUPABASE_ANON_KEY</code> pada bagian atas script.</p>
            <ol>
              <li>Buka Supabase Dashboard → Project Settings → API.</li>
              <li>Salin Project URL ke <code>SUPABASE_URL</code>.</li>
              <li>Salin anon/publishable key ke <code>SUPABASE_ANON_KEY</code>.</li>
              <li>Jalankan SQL setup untuk membuat tabel <code>siswa</code>, <code>absensi</code>, dan <code>spp</code>.</li>
              <li>Deploy <code>index.html</code> ke Vercel.</li>
            </ol>
          </div>
        `;
      }

      async function bootstrap(){
        if(!isConfigured){
          renderSetupNotice();
          return;
        }

        try{
          render();
          setConn('', 'Menghubungkan...');

          const rows=await sb(supabase.from('siswa').select('id').limit(1));

          if(!rows.length){
            setConn('', 'Menyiapkan data awal...');
            await seedDatabase();
          }

          await loadAllData();
          subscribeRealtime();
          setConn('ok', 'Terhubung — data real-time');

        }catch(error){
          console.error(error);
          render();
          setConn('err', 'Gagal terhubung — cek Supabase dan RLS');
        }
      }

      bootstrap();
    </script>
