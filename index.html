<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <title>Gantariku — Absensi &amp; SPP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

      :root {
        --bg: #F4F2FC;
        --surface: #FFFFFF;
        --ink: #211B3B;
        --ink-soft: #6E6690;
        --line: #E7E2F7;
        --primary: #6C4CF1;
        --primary-dark: #4E31D6;
        --primary-soft: #EDE7FD;
        --teal: #0EA5A0;
        --pink: #EC4899;
        --good: #16A34A;
        --good-soft: #DCF7E5;
        --warn: #D97706;
        --warn-soft: #FDECD1;
        --sick: #7C3AED;
        --sick-soft: #EEE5FD;
        --bad: #E11D48;
        --bad-soft: #FCE1E8;
        --muted: #F1EEFA;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2 {
        font-family: 'Space Grotesk', sans-serif;
      }

      /* ========== LOGIN PAGE ========== */
      .login-container {
        display: flex;
        min-height: 100vh;
        background: linear-gradient(135deg, #4E31D6 0%, #6C4CF1 50%, #8B5CF6 100%);
      }

      .login-box {
        margin: auto;
        background: var(--surface);
        border-radius: 16px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 20px 60px rgba(33, 27, 59, .3);
      }

      .login-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 30px;
      }

      .login-logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: linear-gradient(135deg, #4E31D6, #6C4CF1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        color: white;
      }

      .login-brand {
        text-align: left;
      }

      .login-brand h1 {
        font-size: 24px;
        font-weight: 700;
        margin: 0;
        color: var(--ink);
      }

      .login-brand p {
        font-size: 12px;
        color: var(--ink-soft);
        margin: 4px 0 0;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
      }

      .form-group input,
      .form-group select {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        color: var(--ink);
        background: #fff;
        transition: border-color .2s, box-shadow .2s;
      }

      .form-group input:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(108, 76, 241, .1);
      }

      .login-btn {
        padding: 10px 16px;
        background: linear-gradient(135deg, #4E31D6, #6C4CF1);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: transform .1s, box-shadow .2s;
      }

      .login-btn:hover {
        box-shadow: 0 10px 30px rgba(108, 76, 241, .3);
      }

      .login-btn:active {
        transform: scale(.95);
      }

      .login-btn:disabled {
        opacity: .6;
        cursor: not-allowed;
      }

      .error-msg {
        padding: 10px 12px;
        background: var(--bad-soft);
        color: var(--bad);
        border-radius: 8px;
        font-size: 13px;
        display: none;
      }

      .error-msg.show {
        display: block;
      }

      .loading-spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, .3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin .8s linear infinite;
        margin-right: 6px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* ========== APP PAGE ========== */
      .app {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 246px;
        flex-shrink: 0;
        background: linear-gradient(180deg, #4E31D6 0%, #6C4CF1 55%, #8B5CF6 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        padding: 24px 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 22px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: rgba(255, 255, 255, .18);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }

      .brand-text {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 16px;
        line-height: 1.1;
      }

      .brand-sub {
        font-size: 11px;
        color: rgba(255, 255, 255, .7);
      }

      .user-info {
        background: rgba(255, 255, 255, .12);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 22px;
        font-size: 12px;
      }

      .user-name {
        font-weight: 600;
        color: #fff;
      }

      .user-role {
        font-size: 11px;
        color: rgba(255, 255, 255, .7);
        margin-top: 2px;
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .nav-item {
        all: unset;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 11px;
        border-radius: 8px;
        font-size: 13.5px;
        color: rgba(255, 255, 255, .8);
      }

      .nav-item:hover {
        background: rgba(255, 255, 255, .1);
      }

      .nav-item.active {
        background: rgba(255, 255, 255, .95);
        color: var(--primary-dark);
        font-weight: 600;
      }

      .sidebar-foot {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding-top: 14px;
        font-size: 11px;
        color: rgba(255, 255, 255, .7);
      }

      .conn-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #34D399;
      }

      .logout-btn {
        all: unset;
        cursor: pointer;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, .3);
        color: rgba(255, 255, 255, .8);
        font-size: 12px;
        font-weight: 600;
        transition: background .15s;
        text-align: center;
      }

      .logout-btn:hover {
        background: rgba(255, 255, 255, .1);
      }

      .content {
        flex: 1;
        min-width: 0;
      }

      .topbar {
        padding: 26px 34px 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        flex-wrap: wrap;
      }

      .topbar h1 {
        font-size: 23px;
        font-weight: 700;
        margin: 0 0 4px;
      }

      .topbar p {
        margin: 0;
        color: var(--ink-soft);
        font-size: 13px;
      }

      .today-chip {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 7px 14px;
        font-size: 12.5px;
        color: var(--ink-soft);
        font-weight: 500;
        white-space: nowrap;
      }

      .view {
        padding: 6px 34px 50px;
        max-width: 1160px;
      }

      .stat-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 14px;
        margin-bottom: 22px;
      }

      .stat {
        background: var(--surface);
        border-radius: 14px;
        padding: 16px 18px;
        border-left: 4px solid var(--primary);
        box-shadow: 0 1px 2px rgba(33, 27, 59, .05);
      }

      .stat.c-teal { border-left-color: var(--teal); }
      .stat.c-good { border-left-color: var(--good); }
      .stat.c-bad { border-left-color: var(--bad); }
      .stat.c-pink { border-left-color: var(--pink); }

      .stat .num {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 25px;
        font-weight: 700;
        line-height: 1.1;
      }

      .stat .lbl {
        font-size: 12px;
        color: var(--ink-soft);
        margin-top: 5px;
      }

      .section {
        background: var(--surface);
        border-radius: 16px;
        margin-bottom: 20px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(33, 27, 59, .05);
      }

      .section-head {
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      .section-head h2 {
        font-size: 16px;
        font-weight: 700;
        margin: 0;
      }

      .section-body {
        padding: 18px 20px;
      }

      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }

      input[type=text],
      input[type=email],
      input[type=password],
      select {
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: var(--ink);
      }

      input[type=text]:focus,
      input[type=email]:focus,
      input[type=password]:focus,
      select:focus {
        outline: 2px solid var(--primary);
        outline-offset: 1px;
        background: #fff;
      }

      .btn {
        all: unset;
        cursor: pointer;
        padding: 8px 15px;
        border-radius: 8px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        font-size: 12.5px;
        transition: background .15s, transform .1s;
      }

      .btn:hover {
        background: var(--primary-dark);
      }

      .btn:active {
        transform: scale(.97);
      }

      .btn.secondary {
        background: var(--primary-soft);
        color: var(--primary-dark);
      }

      .btn.ghost {
        background: transparent;
        color: var(--ink-soft);
        border: 1px solid var(--line);
      }

      .btn.small {
        padding: 6px 11px;
        font-size: 11.5px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .03em;
        color: var(--ink-soft);
        font-weight: 600;
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
      }

      td {
        padding: 10px;
        border-bottom: 1px solid var(--line);
        font-size: 13.5px;
      }

      tbody tr:hover {
        background: var(--bg);
      }

      tr:last-child td {
        border-bottom: none;
      }

      td.num,
      th.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 600;
      }

      .badge-good { background: var(--good-soft); color: var(--good); }
      .badge-warn { background: var(--warn-soft); color: var(--warn); }
      .badge-sick { background: var(--sick-soft); color: var(--sick); }
      .badge-bad { background: var(--bad-soft); color: var(--bad); }
      .badge-muted { background: var(--muted); color: var(--ink-soft); }

      .empty {
        padding: 34px;
        text-align: center;
        color: var(--ink-soft);
        font-size: 13px;
      }

      @media (max-width: 900px) {
        .stat-row {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 760px) {
        .app {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
          gap: 10px;
          padding: 14px 16px;
        }

        .nav,
        .sidebar-foot {
          display: none;
        }

        .view,
        .topbar {
          padding-left: 18px;
          padding-right: 18px;
        }

        .stat-row {
          grid-template-columns: 1fr 1fr;
        }

        .login-box {
          padding: 30px 20px;
          max-width: calc(100% - 40px);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="module">
      // ============================================================
      // SUPABASE CONFIGURATION
      // ============================================================
      const SUPABASE_URL = "https://uwrbirojmuudshhrrcgt.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_SP0aUTX9jn9p1Kzv74S_Fg_eT4Hrs5E";

      const isConfigured =
        /^https:\/\/.+\.supabase\.co$/.test(SUPABASE_URL) &&
        SUPABASE_ANON_KEY &&
        !SUPABASE_ANON_KEY.includes("PASTE_YOUR");

      let supabase = null;

      if (isConfigured) {
        const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
        supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      // ============================================================
      // GLOBAL STATE
      // ============================================================
      let currentUser = null;
      let currentUserRole = null;

      // ============================================================
      // LOGIN UI
      // ============================================================
      function renderLoginPage() {
        return `
          <div class="login-container">
            <div class="login-box">
              <div class="login-header">
                <div class="login-logo">🎒</div>
                <div class="login-brand">
                  <h1>Gantariku</h1>
                  <p>Absensi &amp; SPP</p>
                </div>
              </div>

              <div class="error-msg" id="loginError"></div>

              <form class="login-form" id="loginForm">
                <div class="form-group">
                  <label for="role">Masuk sebagai</label>
                  <select id="role" required>
                    <option value="">Pilih peran...</option>
                    <option value="admin">Admin Sekolah</option>
                    <option value="guru">Guru</option>
                    <option value="ortu">Orang Tua</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="email">Email</label>
                  <input type="email" id="email" placeholder="nama@sekolah.id" required>
                </div>

                <div class="form-group">
                  <label for="password">Password</label>
                  <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                  <span id="loginBtnText">Masuk</span>
                </button>
              </form>

              <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-soft); text-align: center;">
                <p style="margin: 0 0 8px;">Demo Credentials:</p>
                <code style="background: var(--muted); padding: 4px 8px; border-radius: 4px; display: block;">admin@sekolah.id / password123</code>
              </div>
            </div>
          </div>
        `;
      }

      // ============================================================
      // LOGIN HANDLER
      // ============================================================
      async function handleLogin(e) {
        e.preventDefault();

        const role = document.getElementById("role").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const errorEl = document.getElementById("loginError");
        const btnEl = document.getElementById("loginBtn");
        const btnText = document.getElementById("loginBtnText");

        errorEl.textContent = "";
        errorEl.classList.remove("show");

        if (!role || !email || !password) {
          errorEl.textContent = "Semua field harus diisi";
          errorEl.classList.add("show");
          return;
        }

        btnEl.disabled = true;
        btnText.innerHTML = '<span class="loading-spinner"></span>Memproses...';

        try {
          if (!supabase) {
            throw new Error("Supabase belum dikonfigurasi");
          }

          // Step 1: Authenticate user
          const { data: { user }, error: authError } = await supabase.auth.signInWithPassword({
            email,
            password,
          });

          if (authError) {
            throw new Error(authError.message || "Email atau password salah");
          }

          // Step 2: Get user role from database
          const { data: userData, error: dbError } = await supabase
            .from("pengguna")
            .select("id, nama, email, role")
            .eq("user_id", user.id)
            .eq("role", role)
            .single();

          if (dbError || !userData) {
            throw new Error("Akun tidak ditemukan atau role tidak sesuai");
          }

          // Step 3: Set user data
          currentUser = userData;
          currentUserRole = userData.role;

          // Store in localStorage
          localStorage.setItem("gantariku_user", JSON.stringify(userData));
          localStorage.setItem("gantariku_token", user.id);

          // Render app
          renderApp();

        } catch (error) {
          console.error("Login error:", error);
          errorEl.textContent = error.message || "Terjadi kesalahan saat login";
          errorEl.classList.add("show");
        } finally {
          btnEl.disabled = false;
          btnText.textContent = "Masuk";
        }
      }

      // ============================================================
      // APP UI
      // ============================================================
      function renderApp() {
        const html = `
          <div class="app">
            <aside class="sidebar">
              <div class="brand">
                <div class="brand-mark">🎒</div>
                <div>
                  <div class="brand-text">Gantariku</div>
                  <div class="brand-sub">Absensi &amp; SPP</div>
                </div>
              </div>

              <div class="user-info">
                <div class="user-name">${currentUser.nama}</div>
                <div class="user-role">${getRoleLabel(currentUserRole)}</div>
              </div>

              <div class="nav" id="nav"></div>

              <div class="sidebar-foot">
                <div><span class="conn-dot"></span> Terhubung</div>
                <button class="logout-btn" onclick="window.__app.logout()">Logout</button>
              </div>
            </aside>

            <main class="content">
              <header class="topbar">
                <div>
                  <h1 id="pageTitle">Dasbor</h1>
                  <p id="pageSub">Ringkasan hari ini</p>
                </div>
                <div class="today-chip" id="todayChip"></div>
              </header>
              <section class="view" id="view"></section>
            </main>
          </div>
        `;

        document.getElementById("app").innerHTML = html;
        renderNav();
        renderView();
        updateTodayChip();
      }

      // ============================================================
      // NAVIGATION
      // ============================================================
      const NAV_CONFIG = {
        admin: [
          { id: "dasbor", label: "Dasbor", icon: "📊" },
          { id: "siswa", label: "Data Siswa", icon: "👥" },
          { id: "spp", label: "Monitoring SPP", icon: "💰" },
          { id: "rekap", label: "Rekap Absensi", icon: "📋" },
        ],
        guru: [
          { id: "input-absen", label: "Input Absensi", icon: "✓" },
          { id: "riwayat-absen", label: "Riwayat Absensi", icon: "📅" },
        ],
        ortu: [
          { id: "ringkasan", label: "Ringkasan Anak", icon: "👧" },
          { id: "absen-anak", label: "Kehadiran Anak", icon: "📅" },
          { id: "spp-anak", label: "Status SPP", icon: "💳" },
        ],
      };

      let currentNav = "dasbor";

      function renderNav() {
        const nav = NAV_CONFIG[currentUserRole] || [];
        const navEl = document.getElementById("nav");
        navEl.innerHTML = nav
          .map(
            (item) =>
              `<button class="nav-item ${currentNav === item.id ? "active" : ""}" 
                       onclick="window.__app.goTo('${item.id}')">
                <span>${item.icon}</span>
                <span>${item.label}</span>
              </button>`
          )
          .join("");
      }

      function goTo(navId) {
        currentNav = navId;
        renderNav();
        renderView();
      }

      // ============================================================
      // VIEWS
      // ============================================================
      function renderView() {
        const viewEl = document.getElementById("view");
        const titleEl = document.getElementById("pageTitle");
        const subEl = document.getElementById("pageSub");

        let html = "";
        let title = "Dasbor";
        let subtitle = "Ringkasan hari ini";

        switch (currentNav) {
          case "dasbor":
            html = renderDasbor();
            title = "Dasbor";
            subtitle = "Ringkasan hari ini";
            break;
          case "siswa":
            html = renderSiswa();
            title = "Data Siswa";
            subtitle = "Kelola data siswa";
            break;
          case "spp":
            html = renderSpp();
            title = "Monitoring SPP";
            subtitle = "Pantau pembayaran SPP";
            break;
          case "rekap":
            html = renderRekap();
            title = "Rekap Absensi";
            subtitle = "Laporan kehadiran";
            break;
          case "input-absen":
            html = renderInputAbsen();
            title = "Input Absensi";
            subtitle = "Catat kehadiran siswa";
            break;
          case "riwayat-absen":
            html = renderRiwayatAbsen();
            title = "Riwayat Absensi";
            subtitle = "Lihat riwayat kehadiran";
            break;
          case "ringkasan":
            html = renderRingkasanAnak();
            title = "Ringkasan Anak";
            subtitle = "Ikhtisar prestasi dan pembayaran";
            break;
          case "absen-anak":
            html = renderAbsenAnak();
            title = "Kehadiran Anak";
            subtitle = "Riwayat kehadiran";
            break;
          case "spp-anak":
            html = renderSppAnak();
            title = "Status SPP";
            subtitle = "Status pembayaran SPP";
            break;
          default:
            html = `<div class="empty">Menu tidak ditemukan</div>`;
        }

        viewEl.innerHTML = html;
        titleEl.textContent = title;
        subEl.textContent = subtitle;
      }

      // ============================================================
      // VIEW IMPLEMENTATIONS
      // ============================================================
      function renderDasbor() {
        return `
          <div class="stat-row">
            <div class="stat c-teal">
              <div class="num">24/28</div>
              <div class="lbl">Hadir hari ini</div>
            </div>
            <div class="stat c-good">
              <div class="num">25</div>

      function updateTodayChip() {

        document.getElementById("todayChip").textContent = formatted;
      }

      function getRoleLabel(role) {
        const map = {
          admin: "Admin Sekolah",
          guru: "Guru",
          ortu: "Orang Tua",
        };
        return map[role] || role;
      }

      async function logout() {
        try {
          if (supabase) {
            await supabase.auth.signOut();
          }
          localStorage.removeItem("gantariku_user");
          localStorage.removeItem("gantariku_token");
          currentUser = null;
          currentUserRole = null;
          renderLogin();
        } catch (error) {
          console.error("Logout error:", error);
          renderLogin();
        }
      }

      function renderLogin() {
        document.getElementById("app").innerHTML = renderLoginPage();
        document.getElementById("loginForm").addEventListener("submit", handleLogin);
      }

      // ============================================================
      // INITIALIZATION
      // ============================================================
      async function init() {
        try {
          // Check if user already logged in
          if (supabase) {
            const { data: { session } } = await supabase.auth.getSession();

            if (session) {
              const userData = localStorage.getItem("gantariku_user");
              if (userData) {
                currentUser = JSON.parse(userData);
                currentUserRole = currentUser.role;
                renderApp();
                return;
              }
            }
          }
        } catch (error) {
          console.error("Init error:", error);
        }

        renderLogin();
      }

      // Expose app functions to window
      window.__app = {
        goTo,
        logout,
      };

      // Start app
      init();
    </script>
